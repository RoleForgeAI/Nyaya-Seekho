in the possession of anyone legally entitled to it, shall be punished with imprisonment up to three years, and fine \u2014 extending to seven years if the offender, at the time of the deceased's death, was employed by them as a clerk or servant.",punishment:"Imprisonment up to three years, and fine; up to seven years and fine if the offender was employed as the deceased's clerk or servant. Non-cognizable, bailable, triable by Magistrate of the first class.",illustrations:["Z dies in possession of furniture and money. His servant A, before the money comes into the possession of anyone entitled to it, dishonestly misappropriates it. A has committed the offence defined in this section."],crossRefs:[314]},{id:316,ipc:405,category:"II",title:"Criminal breach of trust",text:"(1) Whoever, being in any manner entrusted with property, or with any dominion over property, dishonestly misappropriates or converts it to their own use, or dishonestly uses or disposes of it in violation of any legal direction prescribing how the trust is to be discharged, or of any express or implied legal contract they have made touching its discharge, or wilfully suffers any other person to do so, commits 'criminal breach of trust'.",simpleExplanation:"The essential difference from theft: the accused already lawfully possesses the property \u2014 they were entrusted with it \u2014 and the offence lies in dishonestly betraying that trust, not in wrongfully taking possession in the first place. R.K. Dalmia is the case to know: it confirmed 'property' here is read broadly, and 'entrustment' isn't limited to formal fiduciary relationships.",explanations:["Explanation 1: An employer who deducts an employee's Provident Fund/Family Pension Fund contribution from wages is deemed entrusted with that amount, and defaulting on paying it into the Fund is deemed a dishonest use of it in violation of the law.","Explanation 2: The same principle applies to an employer who deducts an employee's ESI contribution and defaults on paying it to the ESI Fund."],punishment:"Basic: imprisonment up to five years, or fine, or both. As a carrier/wharfinger/warehouse-keeper: up to seven years, plus fine. As a clerk or servant: up to seven years, plus fine. As a public servant, banker, merchant, factor, broker, attorney, or agent: imprisonment for life, or up to ten years, plus fine.",ingredients:["The accused was entrusted with property, or given dominion over it","They dishonestly misappropriated it, converted it to their own use, or used/disposed of it in violation of a legal direction or contract governing the trust"],illustrations:["A, executor to a deceased person's will, dishonestly disobeys the law directing him to divide the effects per the will, and appropriates them. A has committed criminal breach of trust.","A, a warehouse-keeper, is entrusted by Z with furniture under a contract to return it on payment of warehouse rent. A dishonestly sells the goods. A has committed criminal breach of trust.","Z remits a lakh of rupees to his agent A with directions to invest it in Company's paper. A dishonestly disobeys and uses the money in his own business. A has committed criminal breach of trust.","If A, instead, in good faith believing it better for Z, invests in Bank shares rather than Company's paper as directed, A has not acted dishonestly and has not committed criminal breach of trust, even if Z suffers a loss (though Z may have a civil claim).","A, a revenue officer entrusted with public money, is bound by law or contract to deposit it in a treasury. A dishonestly appropriates it. A has committed criminal breach of trust.","A, a carrier, is entrusted by Z with property to be carried. A dishonestly misappropriates it. A has committed criminal breach of trust."],crossRefs:[314]},{id:317,ipc:410,category:"JJ",title:"Stolen property",text:"(1) Property whose possession has been transferred by theft, extortion, robbery, or cheating, and property that has been criminally misappropriated or is the subject of criminal breach of trust, is 'stolen property' \u2014 whether the transfer, misappropriation, or breach happened within or outside India \u2014 but it ceases to be stolen property once it comes into the possession of a person legally entitled to it.",punishment:"Dishonestly receiving or retaining stolen property, knowing or having reason to believe it stolen: imprisonment up to three years, or fine, or both. Where known/believed to be from a dacoity, or received from someone known/believed to belong to a gang of dacoits: imprisonment for life, or rigorous imprisonment up to ten years, plus fine. Habitually receiving or dealing in stolen property: imprisonment for life, or up to ten years, plus fine. Voluntarily assisting in concealing, disposing of, or making away with property known/believed to be stolen: imprisonment up to three years, or fine, or both.",illustrations:[],crossRefs:[303,308,309]},{id:318,ipc:415,category:"KK",title:"Cheating",text:"(1) Whoever, by deceiving any person, fraudulently or dishonestly induces the person so deceived to deliver any property to any person, or to consent that any person shall retain any property, or intentionally induces the person so deceived to do or omit to do anything they would not have done or omitted if not so deceived, and which act or omission causes or is likely to cause damage or harm to that person in body, mind, reputation, or property, is said to 'cheat'.",simpleExplanation:"Cheating has two distinct paths, both requiring deception: (1) inducing delivery/retention of property, or (2) inducing any act or omission causing likely harm \u2014 the second path doesn't even require property to change hands. Illustration 7 is the one to remember for exams: a broken promise alone is only a civil wrong (breach of contract), unless the accused never intended to keep the promise from the very start \u2014 that's what makes it cheating instead of a contract dispute.",explanations:["A dishonest concealment of facts is a deception within the meaning of this section."],punishment:"Basic: imprisonment up to three years, or fine, or both. Where the offender knows the cheating is likely to cause wrongful loss to a person whose interest they were legally/contractually bound to protect: up to five years, or fine, or both. Where cheating induces delivery of property or the making/altering/destroying of a valuable security: up to seven years, plus fine.",ingredients:["Deception of a person","Fraudulent or dishonest inducement to deliver property, consent to its retention, or do/omit an act","The act/omission causes or is likely to cause damage or harm"],illustrations:["A, by falsely pretending to be in the Civil Service, deceives Z into giving him goods on credit he doesn't mean to pay for. A cheats.","A, by putting a counterfeit mark on an article, deceives Z into believing it was made by a celebrated manufacturer, inducing Z to buy it. A cheats.","A, by showing Z a false sample, deceives Z into believing the article matches it, inducing Z to buy. A cheats.","A tenders a bill on a house where he keeps no money, expecting it to be dishonoured, deceiving Z into delivering an article A never intends to pay for. A cheats.","A, pledging items he knows are not diamonds as diamonds, deceives Z into lending money. A cheats.","A deceives Z into believing he will repay a loan, inducing Z to lend money, not intending to repay it. A cheats.","A deceives Z into believing he will deliver indigo he doesn't intend to deliver, inducing Z to advance money. A cheats \u2014 but if A intended delivery at the time and later merely breaks the contract, that is only a civil wrong, not cheating.","A deceives Z into believing he has performed his part of a contract, which he has not, inducing Z to pay. A cheats.","A sells an estate to B, then, knowing he has no further right to it, sells or mortgages it to Z without disclosing the earlier sale, and takes Z's money. A cheats."],crossRefs:[]},{id:319,ipc:416,category:"KK",title:"Cheating by personation",text:"(1) A person 'cheats by personation' if he cheats by pretending to be some other person, or by knowingly substituting one person for another, or by representing that he or any other person is someone other than who they really are.",explanations:["The offence is committed whether the person impersonated is real or imaginary."],punishment:"Imprisonment up to five years, or fine, or both. Cognizable, bailable, triable by any Magistrate.",illustrations:["A cheats by pretending to be a certain rich banker of the same name. A cheats by personation.","A cheats by pretending to be B, a person who is deceased. A cheats by personation."],crossRefs:[318]},{id:320,ipc:421,category:"LL",title:"Dishonest or fraudulent removal or concealment of property to prevent distribution among creditors",text:"Whoever dishonestly or fraudulently removes, conceals, or delivers to any person, or transfers or causes to be transferred to any person without adequate consideration, any property, intending or knowing it likely that this will prevent the distribution of that property according to law among their creditors or the creditors of another person, shall be punished with imprisonment of six months to two years, or fine, or both.",punishment:"Imprisonment of six months to two years, or fine, or both. Non-cognizable, bailable, triable by any Magistrate.",illustrations:[],crossRefs:[]},{id:321,ipc:422,category:"LL",title:"Dishonestly or fraudulently preventing debt being available for creditors",text:"Whoever dishonestly or fraudulently prevents any debt or demand due to themselves or another person from being made available, according to law, for payment of their debts or the debts of that other person, shall be punished with imprisonment up to two years, or fine, or both.",punishment:"Imprisonment up to two years, or fine, or both. Non-cognizable, bailable, triable by any Magistrate.",illustrations:[],crossRefs:[320]},{id:322,ipc:423,category:"LL",title:"Dishonest or fraudulent execution of deed of transfer containing false statement of consideration",text:"Whoever dishonestly or fraudulently signs, executes, or becomes a party to any deed or instrument purporting to transfer or charge any property or interest, and which contains a false statement regarding the consideration for the transfer/charge, or regarding the person(s) for whose benefit it is really intended, shall be punished with imprisonment up to three years, or fine, or both.",punishment:"Imprisonment up to three years, or fine, or both. Non-cognizable, bailable, triable by any Magistrate.",illustrations:[],crossRefs:[320]},{id:323,ipc:424,category:"LL",title:"Dishonest or fraudulent removal or concealment of property",text:"Whoever dishonestly or fraudulently conceals or removes any property of themselves or another, or assists in its concealment or removal, or dishonestly releases any demand or claim to which they are entitled, shall be punished with imprisonment up to three years, or fine, or both.",punishment:"Imprisonment up to three years, or fine, or both. Non-cognizable, bailable, triable by any Magistrate.",illustrations:[],crossRefs:[320]},{id:324,ipc:425,category:"MM",title:"Mischief",text:"(1) Whoever, with intent to cause, or knowing themselves likely to cause, wrongful loss or damage to the public or any person, causes the destruction of any property, or any change in it or its situation that destroys or diminishes its value or utility, or affects it injuriously, commits 'mischief'.",explanations:["Explanation 1: It is not essential that the offender intend loss or damage to the owner specifically \u2014 it's enough that he intends, or knows likely, wrongful loss or damage to any person, whether or not it's their property.","Explanation 2: Mischief may be committed by an act affecting property belonging to the offender himself, or to himself and others jointly."],punishment:"Basic mischief: up to six months, or fine, or both. Causing loss/damage to any property (including Government/local authority property): up to one year, or fine, or both. Loss/damage of \u20B920,000 to under \u20B91,00,000: up to two years, or fine, or both. Loss/damage of \u20B91,00,000 or more: up to five years, or fine, or both. Mischief with preparation made for causing death, hurt, or wrongful restraint (or fear of these): up to five years, plus fine.",ingredients:["Intent to cause, or knowledge of likelihood of causing, wrongful loss or damage","Destruction of property, or a change in it/its situation that destroys, diminishes, or injuriously affects its value or utility"],illustrations:["A voluntarily burns a valuable security belonging to Z, intending wrongful loss to Z. A has committed mischief.","A introduces water into Z's ice-house, melting the ice, intending wrongful loss to Z. A has committed mischief.","A throws a ring belonging to Z into a river, intending wrongful loss to Z. A has committed mischief.","A, knowing his effects are about to be taken in execution for a debt owed to Z, destroys them to prevent Z recovering the debt. A has committed mischief.","A, having insured a ship, voluntarily causes it to be cast away, intending to damage the underwriters. A has committed mischief.","A causes a ship to be cast away, intending to damage Z, who has lent money on bottomry on the ship. A has committed mischief.","A, having joint property with Z in a horse, shoots the horse, intending wrongful loss to Z. A has committed mischief.","A causes cattle to enter Z's field, intending or knowing likely to cause damage to Z's crop. A has committed mischief."],crossRefs:[]},{id:325,ipc:428,category:"MM",title:"Mischief by killing or maiming animal",text:"Whoever commits mischief by killing, poisoning, maiming, or rendering useless any animal shall be punished with imprisonment up to five years, or fine, or both.",punishment:"Imprisonment up to five years, or fine, or both. Cognizable, bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[324]},{id:326,ipc:430,category:"MM",title:"Mischief by injury, inundation, fire or explosive substance, etc.",text:"Whoever commits mischief by: (1) diminishing the water supply for agriculture, human/animal food or drink, cleanliness, or manufacturing; (2) rendering a public road, bridge, or navigable river/channel impassable or less safe; (3) causing an inundation or obstruction to public drainage causing injury or damage; (4) destroying or moving a navigation sign/signal for rail, aircraft, or ship, or rendering it less useful; (5) destroying or moving a public-servant-fixed land-mark, or rendering it less useful; (6) using fire or an explosive substance to damage any property, including agricultural produce; or (7) using fire or an explosive substance to destroy a building ordinarily used as a place of worship, human dwelling, or custody of property.",punishment:"(1)\u2013(3): up to five years, or fine, or both, each. (4): up to seven years, or fine, or both. (5): up to one year, or fine, or both. (6): up to seven years, plus fine. (7): imprisonment for life, or up to ten years, plus fine.",illustrations:[],crossRefs:[324]},{id:327,ipc:431,category:"MM",title:"Mischief with intent to destroy or make unsafe a rail, aircraft, decked vessel or one of twenty tons burden",text:"(1) Whoever commits mischief to any rail, aircraft, decked vessel, or vessel of twenty tons burden or more, intending to destroy or render it unsafe, or knowing this likely, shall be punished with imprisonment up to ten years, plus fine. (2) The same mischief committed by fire or explosive substance is punishable with imprisonment for life, or up to ten years, plus fine.",punishment:"Up to ten years, plus fine; by fire/explosive, imprisonment for life or up to ten years, plus fine.",illustrations:[],crossRefs:[324]},{id:328,ipc:438,category:"MM",title:"Punishment for intentionally running vessel aground or ashore with intent to commit theft, etc.",text:"Whoever intentionally runs any vessel aground or ashore, intending to commit theft of property on board, or to dishonestly misappropriate such property, or with intent that such theft/misappropriation may be committed, shall be punished with imprisonment up to ten years, plus fine.",punishment:"Imprisonment up to ten years, plus fine. Cognizable, non-bailable, triable by Court of Session.",illustrations:[],crossRefs:[303,314]},{id:329,ipc:441,category:"NN",title:"Criminal trespass and house-trespass",text:"(1) Whoever enters into or upon property in another's possession with intent to commit an offence, or to intimidate, insult, or annoy the person in possession, or having lawfully entered, unlawfully remains with intent to intimidate, insult, annoy, or commit an offence, is said to commit 'criminal trespass'. (2) Criminal trespass by entering or remaining in a building, tent, or vessel used as a human dwelling, or as a place of worship or custody of property, is 'house-trespass'.",explanations:["The introduction of any part of the criminal trespasser's body is sufficient entry to constitute house-trespass."],punishment:"Criminal trespass: imprisonment up to three months, or fine up to \u20B95,000, or both. House-trespass: imprisonment up to one year, or fine up to \u20B95,000, or both.",illustrations:[],crossRefs:[330]},{id:330,ipc:443,category:"NN",title:"House-trespass and house-breaking",text:"(1) House-trespass committed with precautions taken to conceal it from someone entitled to exclude or eject the trespasser is 'lurking house-trespass'. (2) A person commits 'house-breaking' if they enter (or, being inside for an offence, quit) a house through any of six specified means: (a) a passage made by themselves/an abettor for the trespass; (b) a passage not intended for human entrance, or by scaling/climbing; (c) a passage opened by themselves/an abettor by means not intended by the occupier; (d) opening a lock; (e) using criminal force, assault, or the threat of assault; or (f) a passage known to have been fastened against entry and unfastened by themselves/an abettor.",explanations:["Any out-house or building occupied with a house, with immediate internal communication to it, is part of the house for this section."],illustrations:["A commits house-trespass by making a hole through Z's wall and putting his hand through the aperture. This is house-breaking.","A commits house-trespass by creeping into a ship through a port-hole between decks. This is house-breaking.","A commits house-trespass by entering Z's house through a window. This is house-breaking.","A commits house-trespass by entering through a door he had to unfasten first. This is house-breaking.","A commits house-trespass by lifting a latch with a wire through a hole in the door. This is house-breaking.","A finds a key Z had lost, and enters Z's house using it. This is house-breaking.","Z stands in his doorway; A forces a passage by knocking Z down. This is house-breaking.","Z, Y's doorkeeper, stands in the doorway; A enters having deterred Z by threatening to beat him. This is house-breaking."],crossRefs:[329]},{id:331,ipc:456,category:"NN",title:"Punishment for house-trespass or house-breaking",text:"(1) Lurking house-trespass or house-breaking: imprisonment up to two years, plus fine. (2) The same after sunset and before sunrise: up to three years, plus fine. (3) The same to commit an imprisonable offence: up to three years, plus fine (up to ten years, if the intended offence is theft). (4) The same after sunset and before sunrise, to commit an imprisonable offence: up to five years, plus fine (up to fourteen years, if the intended offence is theft). (5) The same with preparation made for causing hurt, assault, wrongful restraint, or fear of these: up to ten years, plus fine. (6) The same after sunset and before sunrise, with such preparation: up to fourteen years, plus fine. (7) Causing grievous hurt, or attempting death/grievous hurt, while committing the same: imprisonment for life, or up to ten years, plus fine. (8) Where, during such an offence after sunset and before sunrise, death or an attempt at death/grievous hurt is voluntarily caused, every person jointly concerned faces imprisonment for life, or up to ten years, plus fine.",punishment:"Escalating scale from two years up to imprisonment for life, depending on timing, intent, and harm caused \u2014 see full text.",illustrations:[],crossRefs:[329,330]},{id:332,ipc:449,category:"NN",title:"House-trespass in order to commit offence",text:"Whoever commits house-trespass in order to commit an offence: (1) punishable with death \u2014 imprisonment for life, or rigorous imprisonment up to ten years, plus fine; (2) punishable with imprisonment for life \u2014 imprisonment up to ten years, plus fine; (3) punishable with imprisonment \u2014 imprisonment up to two years, plus fine.",provisos:["If the offence intended is theft, the imprisonment term under clause (3) may extend to seven years."],illustrations:[],crossRefs:[329]},{id:333,ipc:452,category:"NN",title:"House-trespass after preparation for hurt, assault or wrongful restraint",text:"Whoever commits house-trespass having made preparation for causing hurt to any person, for assaulting any person, for wrongfully restraining any person, or for putting any person in fear of hurt, assault, or wrongful restraint, shall be punished with imprisonment up to seven years, plus fine.",punishment:"Imprisonment up to seven years, plus fine. Cognizable, non-bailable, triable by any Magistrate.",illustrations:[],crossRefs:[329]},{id:334,ipc:461,category:"NN",title:"Dishonestly breaking open receptacle containing property",text:"(1) Whoever dishonestly, or intending mischief, breaks open or unfastens any closed receptacle containing (or believed to contain) property, shall be punished with imprisonment up to two years, or fine, or both. (2) Whoever, being entrusted with such a receptacle without authority to open it, dishonestly or intending mischief breaks it open or unfastens it, shall be punished with imprisonment up to three years, or fine, or both.",illustrations:[],crossRefs:[316]},{id:206,ipc:172,category:"OO",title:"Absconding to avoid service of summons or other proceeding",text:"Whoever absconds in order to avoid being served with a summons, notice, or order from a public servant legally competent to issue it, shall be punished with simple imprisonment up to one month, or fine up to \u20B95,000, or both \u2014 up to six months, or fine up to \u20B910,000, or both, where the summons/notice/order is to attend in person or by agent, or to produce a document/electronic record, in a Court.",punishment:"Up to one month (up to six months if Court-related), or fine, or both.",illustrations:[],crossRefs:[]},{id:207,ipc:173,category:"OO",title:"Preventing service of summons or other proceeding, or preventing publication thereof",text:"Whoever intentionally prevents the serving of a summons/notice/order on themselves or another, or prevents its lawful affixing to a place, or removes it from where it is lawfully affixed, or prevents a lawful proclamation from being made, shall be punished with simple imprisonment up to one month, or fine up to \u20B95,000, or both \u2014 up to six months, or fine up to \u20B910,000, or both, where Court-related.",punishment:"Up to one month (up to six months if Court-related), or fine, or both.",illustrations:[],crossRefs:[206]},{id:208,ipc:174,category:"OO",title:"Non-attendance in obedience to an order from public servant",text:"Whoever, being legally bound to attend in person or by agent at a place and time under a summons/notice/order/proclamation from a legally competent public servant, intentionally omits to attend, or departs before lawfully permitted, shall be punished with simple imprisonment up to one month, or fine up to \u20B95,000, or both \u2014 up to six months, or fine up to \u20B910,000, or both, where the requirement is to attend a Court.",punishment:"Up to one month (up to six months if Court-related), or fine, or both.",illustrations:["A, being legally bound to appear before a High Court, in obedience to a subpoena issuing from that Court, intentionally omits to appear. A has committed the offence defined in this section.","A, being legally bound to appear before a District Judge as a witness, in obedience to a summons issued by that Judge, intentionally omits to appear. A has committed the offence defined in this section."],crossRefs:[]},{id:209,ipc:null,category:"OO",title:"Non-appearance in response to a proclamation under Section 84 of the BNSS, 2023",text:"Whoever fails to appear at the place and time required by a proclamation published under Section 84(1) of the BNSS, 2023 shall be punished with imprisonment up to three years, or fine, or both, or with community service; where declared a proclaimed offender under Section 84(4), imprisonment up to seven years, and fine.",punishment:"Up to three years/fine/community service; up to seven years plus fine if declared a proclaimed offender. Cognizable, non-bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[208]},{id:210,ipc:175,category:"OO",title:"Omission to produce document or electronic record to public servant by person legally bound to produce it",text:"Whoever, being legally bound to produce or deliver a document or electronic record to a public servant, intentionally omits to do so, shall be punished with simple imprisonment up to one month, or fine up to \u20B95,000, or both \u2014 up to six months, or fine up to \u20B910,000, or both, where it is to be produced before a Court.",punishment:"Up to one month (up to six months if Court-related), or fine, or both.",illustrations:["A, being legally bound to produce a document before a District Court, intentionally omits to produce the same. A has committed the offence defined in this section."],crossRefs:[]},{id:211,ipc:176,category:"OO",title:"Omission to give notice or information to public servant by person legally bound to give it",text:"Whoever, being legally bound to give notice or furnish information on a subject to a public servant, intentionally omits to do so in the manner and time required by law, shall be punished with simple imprisonment up to one month, or fine up to \u20B95,000, or both \u2014 up to six months, or fine up to \u20B910,000, or both, where the information concerns the commission of an offence, preventing one, or apprehending an offender \u2014 or up to six months, or fine up to \u20B91,000, or both, where required by an order under Section 447, BNSS.",punishment:"Up to one month, escalating to six months depending on the subject-matter.",illustrations:[],crossRefs:[212]},{id:212,ipc:177,category:"OO",title:"Furnishing false information",text:"Whoever, being legally bound to furnish information to a public servant, furnishes as true, information they know or have reason to believe is false, shall be punished with simple imprisonment up to six months, or fine up to \u20B95,000, or both \u2014 up to two years, or fine, or both, where the information concerns the commission of an offence, preventing one, or apprehending an offender.",explanations:["In this section and Section 209, 'offence' includes any act committed outside India which, if committed in India, would be punishable under Sections 97, 99, 172\u2013175, 301, clauses (b)\u2013(d) of Section 303, 304, 305, 306, 320, 325, and 326; and 'offender' includes any person alleged to be guilty of such an act."],punishment:"Up to six months (up to two years if concerning an offence, prevention, or apprehension), or fine, or both.",illustrations:["A, a landholder, knowing of a murder within his estate, wilfully misinforms the Magistrate that death occurred by snakebite. A is guilty of the offence defined in this section.","A, a village watchman, knowing a body of strangers passed through his village to commit dacoity at Z's house nearby, and being bound to inform the nearest police station, wilfully misinforms the officer that the strangers were headed to commit dacoity somewhere else entirely. A is guilty of the offence defined in the latter part of this section."],crossRefs:[211]},{id:213,ipc:178,category:"OO",title:"Refusing oath or affirmation when duly required by public servant to make it",text:"Whoever refuses to bind himself by an oath or affirmation to state the truth, when required to do so by a public servant legally competent to require it, shall be punished with simple imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:214,ipc:179,category:"OO",title:"Refusing to answer public servant authorised to question",text:"Whoever, being legally bound to state the truth on a subject to a public servant, refuses to answer a question demanded of them touching that subject by that public servant in the exercise of their legal powers, shall be punished with simple imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[213]},{id:215,ipc:180,category:"OO",title:"Refusing to sign statement",text:"Whoever refuses to sign a statement made by them, when required to sign it by a public servant legally competent to require this, shall be punished with simple imprisonment up to three months, or fine up to \u20B93,000, or both.",punishment:"Up to three months, or fine up to \u20B93,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:216,ipc:181,category:"OO",title:"False statement on oath or affirmation to public servant or person authorised to administer an oath or affirmation",text:"Whoever, being legally bound by an oath or affirmation to state the truth on a subject to a public servant or person authorised to administer it, makes a statement on that subject which is false, and which they know or believe to be false, or do not believe to be true, shall be punished with imprisonment up to three years, and fine.",punishment:"Imprisonment up to three years, and fine. Non-cognizable, bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[]},{id:217,ipc:182,category:"OO",title:"False information, with intent to cause public servant to use his lawful power to the injury of another person",text:"Whoever gives a public servant information they know or believe to be false, intending or knowing it likely to cause that public servant to do or omit something they ought not to (if the true facts were known), or to use their lawful power to the injury or annoyance of any person, shall be punished with imprisonment up to one year, or fine up to \u20B910,000, or both.",punishment:"Up to one year, or fine up to \u20B910,000, or both. Non-cognizable, bailable.",illustrations:["A informs a Magistrate that Z, a police officer subordinate to that Magistrate, has been guilty of neglect of duty, knowing this to be false and knowing it likely to cause the Magistrate to dismiss Z. A has committed the offence defined in this section.","A falsely informs a public servant that Z has contraband salt in a secret place, knowing this is false and knowing it likely to cause a search of Z's premises, annoying Z. A has committed the offence defined in this section.","A falsely informs a policeman that he was assaulted and robbed near a particular village, without naming any assailant, knowing it likely that the police will make enquiries and searches to the annoyance of the villagers. A has committed an offence under this section."],crossRefs:[]},{id:218,ipc:183,category:"PP",title:"Resistance to the taking of property by the lawful authority of a public servant",text:"Whoever offers resistance to the taking of property by the lawful authority of a public servant, knowing or having reason to believe they are such a public servant, shall be punished with imprisonment up to six months, or fine up to \u20B910,000, or both.",punishment:"Up to six months, or fine up to \u20B910,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:219,ipc:186,category:"PP",title:"Obstructing sale of property offered for sale by authority of public servant",text:"Whoever intentionally obstructs a sale of property offered for sale by the lawful authority of a public servant shall be punished with imprisonment up to one month, or fine up to \u20B95,000, or both.",punishment:"Up to one month, or fine up to \u20B95,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[218]},{id:220,ipc:187,category:"PP",title:"Illegal purchase or bid for property offered for sale by authority of public servant",text:"Whoever, at a sale of property held by the lawful authority of a public servant, purchases or bids for property on account of anyone they know to be under a legal incapacity to purchase it at that sale, or bids without intending to perform the resulting obligations, shall be punished with imprisonment up to one month, or fine up to \u20B9200, or both.",punishment:"Up to one month, or fine up to \u20B9200, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:221,ipc:186,category:"PP",title:"Obstructing public servant in discharge of public functions",text:"Whoever voluntarily obstructs a public servant in the discharge of their public functions shall be punished with imprisonment up to three months, or fine up to \u20B92,500, or both.",punishment:"Up to three months, or fine up to \u20B92,500, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:222,ipc:187,category:"PP",title:"Omission to assist public servant when bound by law to give assistance",text:"Whoever, being bound by law to render assistance to a public servant in executing their public duty, intentionally omits to give it, shall be punished with simple imprisonment up to one month, or fine up to \u20B92,500, or both \u2014 up to six months, or fine up to \u20B95,000, or both, where the assistance was demanded for executing a lawful Court process, preventing an offence, suppressing a riot/affray, or apprehending/re-apprehending a person charged with or escaped from custody for an offence.",punishment:"Up to one month, escalating to six months for the listed graver purposes.",illustrations:[],crossRefs:[]},{id:223,ipc:188,category:"PP",title:"Disobedience to order duly promulgated by public servant",text:"Whoever, knowing they are directed by a lawfully-empowered public servant's order to abstain from an act or to take certain order with property, disobeys that direction, shall \u2014 if the disobedience causes or tends to cause obstruction, annoyance, or injury (or risk of it) to persons lawfully employed \u2014 be punished with simple imprisonment up to six months, or fine up to \u20B92,500, or both; where it causes or tends to cause danger to human life, health, or safety, or a riot or affray, imprisonment up to one year, or fine up to \u20B95,000, or both.",explanations:["It is not necessary that the offender intend to produce harm or contemplate the disobedience as likely to produce it \u2014 it is enough that they know of the order and that the disobedience produces, or is likely to produce, harm."],punishment:"Up to six months, or up to one year if danger/riot results, or fine, or both.",illustrations:["An order is promulgated by a lawfully-empowered public servant directing that a religious procession shall not pass down a certain street. A knowingly disobeys, thereby causing danger of a riot. A has committed the offence defined in this section."],crossRefs:[]},{id:224,ipc:189,category:"PP",title:"Threat of injury to public servant",text:"Whoever holds out any threat of injury to a public servant, or to a person that public servant is believed to be interested in, for the purpose of inducing that public servant to do, forbear, or delay any act connected with the exercise of their public functions, shall be punished with imprisonment up to two years, or fine, or both.",punishment:"Up to two years, or fine, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:225,ipc:190,category:"PP",title:"Threat of injury to induce person to refrain from applying for protection to public servant",text:"Whoever holds out any threat of injury to a person, for the purpose of inducing them to refrain from making a legal application for protection against injury to a public servant legally empowered to give such protection, shall be punished with imprisonment up to one year, or fine, or both.",punishment:"Up to one year, or fine, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[224]},{id:226,ipc:309,category:"PP",title:"Attempt to commit suicide to compel or restrain exercise of lawful power",text:"Whoever attempts to commit suicide with intent to compel or restrain a public servant from discharging their official duty shall be punished with simple imprisonment up to one year, or fine, or both, or with community service.",punishment:"Up to one year, or fine, or both, or community service. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:227,ipc:191,category:"QQ",title:"Giving false evidence",text:"Whoever, being legally bound by an oath or express legal provision to state the truth, or bound by law to make a declaration, makes a statement which is false, and which they either know or believe to be false, or do not believe to be true, is said to give false evidence.",explanations:["Explanation 1: A statement is within this section whether made verbally or otherwise.","Explanation 2: A false statement as to belief is within this section \u2014 a person may give false evidence by stating they believe something they don't believe, just as by stating they know something they don't know."],ingredients:["Legally bound by oath, legal provision, or a declaration requirement to state the truth","Makes a statement that is false","Knows or believes it to be false, or does not believe it to be true"],illustrations:["A, in support of a just claim B has against Z, falsely swears at trial that he heard Z admit the justice of B's claim. A has given false evidence.","A, bound by oath, states he believes a signature to be Z's handwriting, when he does not believe this. A states what he knows to be false \u2014 false evidence.","A, knowing Z's general handwriting, in good faith states he believes a signature to be Z's. This is merely A's honest belief, true as to his belief \u2014 not false evidence, even if the signature isn't actually Z's.","A, bound by oath, states he knows Z was at a particular place on a particular day, not knowing anything on the subject. A gives false evidence, whether or not Z was actually there.","An interpreter, bound by oath to interpret truly, certifies as a true translation something he does not believe to be a true translation. He has given false evidence."],crossRefs:[229]},{id:228,ipc:192,category:"QQ",title:"Fabricating false evidence",text:"Whoever causes a circumstance to exist, or makes a false entry in a book/record/electronic record, or makes a document/electronic record containing a false statement, intending that it may appear in evidence in a judicial proceeding (or a proceeding before a public servant or arbitrator), and thereby cause a person forming an opinion on the evidence to reach an erroneous conclusion material to the result, is said to 'fabricate false evidence.'",illustrations:["A puts jewels in Z's box, intending they be found there so Z is convicted of theft. A has fabricated false evidence.","A makes a false entry in his shop-book to use as corroborative evidence in Court. A has fabricated false evidence.","A, intending to cause Z to be convicted of criminal conspiracy, writes a letter imitating Z's handwriting, addressed to a supposed accomplice, and places it where he knows the police are likely to search. A has fabricated false evidence."],crossRefs:[227,229]},{id:229,ipc:193,category:"QQ",title:"Punishment for false evidence",text:"(1) Whoever intentionally gives false evidence in any stage of a judicial proceeding, or fabricates false evidence for use in any stage of a judicial proceeding, shall be punished with imprisonment up to seven years, and fine up to \u20B910,000. (2) In any other case, imprisonment up to three years, and fine up to \u20B95,000.",explanations:["Explanation 1: A trial before a Court-martial is a judicial proceeding.","Explanation 2: An investigation directed by law preliminary to a Court proceeding is a stage of judicial proceeding, even if not held before a Court.","Explanation 3: An investigation directed by, and conducted under the authority of, a Court is a stage of judicial proceeding, even if not held before a Court."],punishment:"Up to seven years and fine (judicial proceedings); up to three years and fine (otherwise).",illustrations:["A, in an inquiry before a Magistrate to decide whether Z should be committed for trial, makes a statement on oath he knows to be false. As this inquiry is a stage of judicial proceeding, A has given false evidence.","A, in an inquiry before an officer deputed by a Court to ascertain land boundaries, makes a statement on oath he knows to be false. As this inquiry is a stage of judicial proceeding, A has given false evidence."],crossRefs:[227,228]},{id:230,ipc:194,category:"QQ",title:"Giving or fabricating false evidence with intent to procure conviction of capital offence",text:"(1) Whoever gives or fabricates false evidence, intending or knowing it likely to cause any person to be convicted of an offence carrying the death penalty, shall be punished with imprisonment for life, or rigorous imprisonment up to ten years, and fine up to \u20B950,000. (2) If an innocent person is convicted and executed as a result, the offender shall be punished with death, or the punishment above.",punishment:"Imprisonment for life or up to ten years, plus fine; death if an innocent person is executed as a result.",illustrations:[],crossRefs:[227,228]},{id:231,ipc:195,category:"QQ",title:"Giving or fabricating false evidence with intent to procure conviction of offence punishable with imprisonment for life or imprisonment",text:"Whoever gives or fabricates false evidence, intending or knowing it likely to cause a person to be convicted of a non-capital offence punishable with imprisonment for life or seven or more years, shall be punished as a person convicted of that offence would be liable to be punished.",punishment:"Same as for the offence the false evidence targeted. Non-cognizable, non-bailable, triable by Court of Session.",illustrations:["A gives false evidence before a Court intending to cause Z to be convicted of dacoity, punishable with imprisonment for life or up to ten years, with or without fine. A is therefore liable to imprisonment for life or imprisonment, with or without fine."],crossRefs:[227,228]},{id:232,ipc:195,category:"QQ",title:"Threatening any person to give false evidence",text:"(1) Whoever threatens another with injury to person, reputation, or property (or to someone they're interested in), intending to cause that person to give false evidence, shall be punished with imprisonment up to seven years, or fine, or both. (2) If an innocent person is convicted and sentenced to death or over seven years' imprisonment as a result, the threatener is punished the same way as that innocent person.",punishment:"Up to seven years, or fine, or both; matching the innocent person's sentence if their conviction results.",illustrations:[],crossRefs:[227]},{id:233,ipc:196,category:"QQ",title:"Using evidence known to be false",text:"Whoever corruptly uses or attempts to use, as true or genuine, evidence they know to be false or fabricated, shall be punished the same way as if they had given or fabricated false evidence.",punishment:"Same as giving/fabricating false evidence.",illustrations:[],crossRefs:[227,228]},{id:234,ipc:197,category:"QQ",title:"Issuing or signing false certificate",text:"Whoever issues or signs a certificate required or admissible by law, knowing or believing it to be materially false, shall be punished the same way as if they had given false evidence.",punishment:"Same as giving false evidence. Non-cognizable, bailable.",illustrations:[],crossRefs:[227]},{id:235,ipc:198,category:"QQ",title:"Using as true a certificate known to be false",text:"Whoever corruptly uses or attempts to use, as a true certificate, one they know to be materially false, shall be punished the same way as if they had given false evidence.",punishment:"Same as giving false evidence. Non-cognizable, bailable.",illustrations:[],crossRefs:[234]},{id:236,ipc:199,category:"QQ",title:"False statement made in declaration which is by law receivable as evidence",text:"Whoever, in a declaration they make or subscribe, which a Court or public servant is bound or authorised by law to receive as evidence of a fact, makes a statement they know or believe to be false or don't believe to be true, touching a point material to the declaration's purpose, shall be punished the same way as if they had given false evidence.",explanations:["In this and the next section, and Section 240, 'offence' includes any act committed outside India that would be punishable under Sections 97, 99, 172\u2013175, 301, 304, 305, 306, 320, 325, and 326 if committed in India."],punishment:"Same as giving false evidence. Non-cognizable, bailable.",illustrations:[],crossRefs:[227]},{id:237,ipc:200,category:"QQ",title:"Using as true such declaration knowing it to be false",text:"Whoever corruptly uses or attempts to use, as true, a declaration they know to be materially false, shall be punished the same way as if they had given false evidence.",explanations:["A declaration inadmissible merely for informality is still a declaration within the meaning of Sections 234 and 237."],punishment:"Same as giving false evidence. Non-cognizable, bailable.",illustrations:[],crossRefs:[236]},{id:238,ipc:201,category:"RR",title:"Causing disappearance of evidence of offence, or giving false information to screen offender",text:"Whoever, knowing or having reason to believe an offence has been committed, causes evidence of it to disappear (intending to screen the offender), or gives false information about it with that intention, shall be punished: (a) up to seven years, plus fine, if the offence is punishable with death; (b) up to three years, plus fine, if punishable with life imprisonment or up to ten years; (c) up to one-fourth of the longest term for the offence, or fine, or both, in any other case.",punishment:"Escalating scale from one-fourth the offence's term up to seven years, depending on the underlying offence's severity.",illustrations:["A, knowing that B has murdered Z, assists B in hiding the body intending to screen B from punishment. A is liable to imprisonment up to seven years, and fine."],crossRefs:[]},{id:239,ipc:202,category:"RR",title:"Intentional omission to give information of offence by person bound to inform",text:"Whoever, knowing or having reason to believe an offence has been committed, intentionally omits to give information about it that they are legally bound to give, shall be punished with imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[238]},{id:240,ipc:203,category:"RR",title:"Giving false information respecting an offence committed",text:"Whoever, knowing or having reason to believe an offence has been committed, gives information about it that they know or believe to be false, shall be punished with imprisonment up to two years, or fine, or both.",punishment:"Up to two years, or fine, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[239]},{id:241,ipc:204,category:"RR",title:"Destruction of document or electronic record to prevent its production as evidence",text:"Whoever secretes or destroys a document/electronic record they may be lawfully compelled to produce as evidence, or obliterates/renders illegible any part of it, intending to prevent its production or use as evidence, shall be punished with imprisonment up to three years, or fine up to \u20B95,000, or both.",punishment:"Up to three years, or fine up to \u20B95,000, or both. Non-cognizable, bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[]},{id:242,ipc:205,category:"RR",title:"False personation for purpose of act or proceeding in suit or prosecution",text:"Whoever falsely personates another and, in that assumed character, makes an admission or statement, confesses judgment, causes process to be issued, becomes bail or security, or does any other act in a suit or criminal prosecution, shall be punished with imprisonment up to three years, or fine, or both.",punishment:"Up to three years, or fine, or both. Non-cognizable, bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[]},{id:243,ipc:206,category:"RR",title:"Fraudulent removal or concealment of property to prevent its seizure as forfeited or in execution",text:"Whoever fraudulently removes, conceals, transfers, or delivers any property to prevent it being taken as forfeiture or in satisfaction of a fine under a sentence, or from being taken in execution of a decree/order made or likely to be made by a Court, shall be punished with imprisonment up to three years, or fine up to \u20B95,000, or both.",punishment:"Up to three years, or fine up to \u20B95,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[244]},{id:244,ipc:207,category:"RR",title:"Fraudulent claim to property to prevent its seizure as forfeited or in execution",text:"Whoever fraudulently accepts, receives, or claims property (or an interest in it) knowing they have no right or rightful claim to it, or practices deception touching such a claim, intending to prevent it being taken as forfeiture or in execution of a decree, shall be punished with imprisonment up to two years, or fine, or both.",punishment:"Up to two years, or fine, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[243]},{id:245,ipc:208,category:"RR",title:"Fraudulently suffering decree for sum not due",text:"Whoever fraudulently causes or suffers a decree/order to be passed against them for a sum, or property, they don't owe or aren't entitled to be claimed against, or fraudulently causes/suffers a decree to be executed after satisfaction, shall be punished with imprisonment up to two years, or fine, or both.",punishment:"Up to two years, or fine, or both. Non-cognizable, bailable, triable by Magistrate of the first class.",illustrations:["A institutes a suit against Z. Z, knowing A is likely to win, fraudulently suffers judgment to pass against him for a larger sum at B's suit \u2014 B having no just claim \u2014 so that B (for his own benefit, or Z's) may share the proceeds of any sale of Z's property under A's decree. Z has committed an offence under this section."],crossRefs:[]},{id:246,ipc:209,category:"RR",title:"Dishonestly making false claim in Court",text:"Whoever fraudulently or dishonestly, or with intent to injure or annoy any person, makes a claim in Court they know to be false, shall be punished with imprisonment up to two years, and fine.",punishment:"Up to two years, and fine. Non-cognizable, bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[]},{id:247,ipc:210,category:"RR",title:"Fraudulently obtaining decree for sum not due",text:"Whoever fraudulently obtains a decree/order against a person for a sum, or property, not due or not entitled to, or fraudulently causes a decree to be executed after satisfaction, or permits such an act in their name, shall be punished with imprisonment up to two years, or fine, or both.",punishment:"Up to two years, or fine, or both. Non-cognizable, bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[245]},{id:248,ipc:211,category:"RR",title:"False charge of offence made with intent to injure",text:"Whoever, intending to injure a person, institutes (or causes to be instituted) a criminal proceeding against them, or falsely charges them with an offence, knowing there's no just or lawful ground for it, shall be punished with imprisonment up to five years, or fine up to \u20B92,00,000, or both \u2014 up to ten years, plus fine, if the false charge concerns an offence punishable with death, life imprisonment, or ten or more years.",punishment:"Up to five years (up to ten years for grave false charges), or fine, or both.",illustrations:[],crossRefs:[]},{id:249,ipc:212,category:"RR",title:"Harbouring offender",text:"Whoever, knowing or having reason to believe a person is an offender, harbours or conceals them intending to screen them from legal punishment, shall be punished: (a) up to five years, plus fine, if the offence is punishable with death; (b) up to three years, plus fine, if punishable with life imprisonment or up to ten years; (c) up to one-fourth of the longest term for the offence, or fine, or both, in any other case.",explanations:["'Offence' includes any act committed outside India which, if committed in India, would be punishable under Sections 97, 99, 172\u2013175, 301, 304, 305, 306, 320, 325, and 326."],provisos:["This section does not extend to a case where the harbourer or concealer is the offender's spouse."],punishment:"Escalating scale up to five years, depending on the underlying offence's severity.",illustrations:["A, knowing B has committed dacoity, knowingly conceals B to screen him from punishment. Since dacoity carries imprisonment for life, A is liable to imprisonment up to three years, and fine."],crossRefs:[]},{id:250,ipc:213,category:"RR",title:"Taking gift, etc., to screen an offender from punishment",text:"Whoever accepts, attempts to obtain, or agrees to accept, any gratification (or restitution of property) in consideration for concealing an offence, screening an offender, or not proceeding against a person, shall be punished: (a) up to seven years, plus fine, if the offence is punishable with death; (b) up to three years, plus fine, if punishable with life imprisonment or up to ten years; (c) up to one-fourth of the longest term for the offence, or fine, or both, in any other case.",punishment:"Escalating scale up to seven years, depending on the underlying offence's severity.",illustrations:[],crossRefs:[249]},{id:251,ipc:214,category:"RR",title:"Offering gift or restoration of property in consideration of screening offender",text:"Whoever gives, offers, or agrees to give any gratification, or restores property, in consideration of concealing an offence, screening an offender, or not proceeding against a person, shall be punished on the same escalating scale as Section 250.",punishment:"Same escalating scale as Section 250, up to seven years.",illustrations:[],crossRefs:[250]},{id:252,ipc:215,category:"RR",title:"Taking gift to help to recover stolen property, etc.",text:"Whoever takes, agrees, or consents to take a gratification under pretence of helping a person recover movable property they were deprived of by an offence, shall \u2014 unless they use all means in their power to have the offender apprehended and convicted \u2014 be punished with imprisonment up to two years, or fine, or both.",punishment:"Up to two years, or fine, or both. Cognizable, bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[]},{id:253,ipc:216,category:"RR",title:"Harbouring offender who has escaped from custody or whose apprehension has been ordered",text:"Whoever, knowing that a person has escaped lawful custody, or that a public servant has ordered a person's apprehension, harbours or conceals that person intending to prevent their apprehension, shall be punished: (a) up to seven years, plus fine, if the underlying offence is punishable with death; (b) up to three years, with or without fine, if punishable with life imprisonment or ten years; (c) up to one-fourth of the longest term for the offence, or fine, or both, in any other case.",explanations:["'Offence' also includes an act/omission alleged to have occurred outside India, which if committed in India would be punishable, and for which the person is liable to be apprehended or detained under extradition law or otherwise."],provisos:["Does not extend to harbouring/concealment by the spouse of the person to be apprehended."],punishment:"Escalating scale up to seven years, depending on the underlying offence's severity.",illustrations:[],crossRefs:[249]},{id:254,ipc:216,category:"RR",title:"Penalty for harbouring robbers or dacoits",text:"Whoever, knowing or having reason to believe that persons are about to commit or have recently committed robbery or dacoity, harbours them (or any of them) intending to facilitate or screen the offence, shall be punished with rigorous imprisonment up to seven years, and fine.",explanations:["It is immaterial whether the robbery/dacoity is intended to be, or has been, committed within or outside India."],provisos:["Does not extend to harbouring by the spouse of the offender."],punishment:"Rigorous imprisonment up to seven years, and fine. Cognizable, bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[310]},{id:255,ipc:217,category:"SS",title:"Public servant disobeying direction of law with intent to save person from punishment or property from forfeiture",text:"Whoever, being a public servant, knowingly disobeys a legal direction as to how they should conduct themselves, intending or knowing it likely to save a person from legal punishment (or subject them to a lesser one), or to save property from forfeiture or a legal charge, shall be punished with imprisonment up to two years, or fine, or both.",punishment:"Up to two years, or fine, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:256,ipc:218,category:"SS",title:"Public servant framing incorrect record or writing with intent to save person from punishment or property from forfeiture",text:"Whoever, being a public servant charged with preparing a record or writing, frames it in a manner they know to be incorrect, intending or knowing it likely to cause loss/injury to the public or a person, or to save a person from legal punishment, or save property from forfeiture, shall be punished with imprisonment up to three years, or fine, or both.",punishment:"Up to three years, or fine, or both. Cognizable, bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[255]},{id:257,ipc:219,category:"SS",title:"Public servant in judicial proceeding corruptly making report, etc., contrary to law",text:"Whoever, being a public servant, corruptly or maliciously makes or pronounces, at any stage of a judicial proceeding, a report, order, verdict, or decision they know to be contrary to law, shall be punished with imprisonment up to seven years, or fine, or both.",punishment:"Up to seven years, or fine, or both. Non-cognizable, bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[]},{id:258,ipc:220,category:"SS",title:"Commitment for trial or confinement by person having authority who knows that he is acting contrary to law",text:"Whoever, having legal authority to commit persons for trial or confinement, or to keep persons in confinement, corruptly or maliciously commits or confines a person, knowing they are acting contrary to law, shall be punished with imprisonment up to seven years, or fine, or both.",punishment:"Up to seven years, or fine, or both. Non-cognizable, bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[257]},{id:259,ipc:221,category:"SS",title:"Intentional omission to apprehend on the part of public servant bound to apprehend",text:"Whoever, being a public servant legally bound to apprehend or keep in confinement a person charged with or liable to apprehension for an offence, intentionally omits to apprehend them, or suffers/aids their escape, shall be punished with imprisonment up to seven years (with or without fine) if the offence is capital; up to three years (with or without fine) if punishable with life imprisonment or up to ten years; up to two years (with or without fine) if punishable with less than ten years.",punishment:"Escalating scale up to seven years, depending on the underlying offence's severity.",illustrations:[],crossRefs:[]},{id:260,ipc:222,category:"SS",title:"Intentional omission to apprehend on the part of public servant bound to apprehend person under sentence or lawfully committed",text:"Whoever, being a public servant legally bound to apprehend or confine a person already under sentence or lawfully committed to custody, intentionally omits to apprehend them or suffers/aids their escape, shall be punished with imprisonment for life or up to fourteen years (with or without fine) if the person was under sentence of death; up to seven years (with or without fine) if under a life sentence or ten-plus years; up to three years, or fine, or both, otherwise.",punishment:"Escalating scale up to imprisonment for life, depending on the severity of the original sentence.",illustrations:[],crossRefs:[259]},{id:261,ipc:223,category:"SS",title:"Escape from confinement or custody negligently suffered by public servant",text:"Whoever, being a public servant legally bound to keep a charged, convicted, or lawfully committed person in confinement, negligently suffers their escape, shall be punished with simple imprisonment up to two years, or fine, or both.",punishment:"Up to two years, or fine, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[259]},{id:262,ipc:224,category:"TT",title:"Resistance or obstruction by a person to his lawful apprehension",text:"Whoever intentionally resists or illegally obstructs the lawful apprehension of themselves for an offence they are charged with or convicted of, or escapes/attempts to escape from lawful custody for such an offence, shall be punished with imprisonment up to two years, or fine, or both.",explanations:["This punishment is in addition to the punishment for the offence with which the person was charged or convicted."],punishment:"Up to two years, or fine, or both, in addition to the underlying offence's punishment. Cognizable, bailable.",illustrations:[],crossRefs:[]},{id:263,ipc:225,category:"TT",title:"Resistance or obstruction to lawful apprehension of another person",text:"Whoever intentionally resists or illegally obstructs the lawful apprehension of another person, or rescues/attempts to rescue them from lawful custody, shall be punished with imprisonment up to two years, or fine, or both \u2014 up to three years, plus fine, if the person is liable for an offence carrying life imprisonment or up to ten years; up to seven years, plus fine, if capital, or if already under a life/ten-plus-year sentence; up to ten years, plus fine, if under sentence of death.",punishment:"Escalating scale from two to ten years, depending on the person rescued/obstructed's exposure.",illustrations:[],crossRefs:[262]},{id:264,ipc:226,category:"TT",title:"Omission to apprehend, or sufferance of escape, on part of public servant, in cases not otherwise provided for",text:"Whoever, being a public servant legally bound to apprehend or confine a person in a case not covered by Sections 257\u2013259 or other law, omits to apprehend them or suffers their escape, shall be punished with imprisonment up to three years, or fine, or both, if intentional; or simple imprisonment up to two years, or fine, or both, if negligent.",punishment:"Up to three years (intentional) or up to two years (negligent), or fine, or both.",illustrations:[],crossRefs:[259,261]},{id:265,ipc:225,category:"TT",title:"Resistance or obstruction to lawful apprehension or escape or rescue in cases not otherwise provided for",text:"Whoever, in a case not covered by Sections 260\u2013261 or other law, intentionally resists or illegally obstructs their own or another's lawful apprehension, or escapes/attempts to escape lawful custody, or rescues/attempts to rescue another from it, shall be punished with imprisonment up to six months, or fine, or both.",punishment:"Up to six months, or fine, or both. Cognizable, bailable.",illustrations:[],crossRefs:[262,263]},{id:266,ipc:224,category:"TT",title:"Violation of condition of remission of punishment",text:"Whoever, having accepted a conditional remission of punishment, knowingly violates a condition of that remission, shall be punished with the original sentence \u2014 in full, if none has been served, or with the residue, if part has already been served.",punishment:"The original sentence or its unserved residue. Cognizable, non-bailable.",illustrations:[],crossRefs:[]},{id:267,ipc:228,category:"TT",title:"Intentional insult or interruption to public servant sitting in judicial proceeding",text:"Whoever intentionally insults, or causes interruption to, a public servant while sitting in any stage of a judicial proceeding, shall be punished with simple imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:268,ipc:null,category:"TT",title:"Personation of an assessor",text:"Whoever, by personation or otherwise, intentionally causes or knowingly suffers themselves to be returned, empanelled, or sworn as an assessor knowing they are not entitled by law to be so, or knowing they were so returned contrary to law, voluntarily serves as an assessor, shall be punished with imprisonment up to two years, or fine, or both.",punishment:"Up to two years, or fine, or both. Non-cognizable, bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[]},{id:269,ipc:null,category:"TT",title:"Failure by person released on bail or bond to appear in court",text:"Whoever, having been charged with an offence and released on bail or on a bond without sureties, fails without sufficient cause (the burden of proof lying on them) to appear in Court per the bail/bond terms, shall be punished with imprisonment up to one year, or fine, or both.",explanations:["This punishment is in addition to the punishment for the offence they were charged with, and is without prejudice to the Court's power to order forfeiture of the bond."],punishment:"Up to one year, or fine, or both, in addition to the underlying charge's punishment. Cognizable, non-bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[]},{id:270,ipc:268,category:"UU",title:"Public nuisance",text:"A person is guilty of a public nuisance who does an act, or is guilty of an illegal omission, causing common injury, danger, or annoyance to the public or to people in general who dwell or occupy property nearby, or which necessarily causes injury, obstruction, danger, or annoyance to persons who may have occasion to use a public right \u2014 a common nuisance is not excused merely because it causes some convenience or advantage.",simpleExplanation:"The defining feature of public nuisance, versus a private civil wrong, is that it affects the public generally or a class of the public, not just one identifiable victim \u2014 and importantly, the nuisance-maker can't defend it by pointing to some benefit or convenience it also creates.",illustrations:[],crossRefs:[]},{id:271,ipc:269,category:"UU",title:"Negligent act likely to spread infection of disease dangerous to life",text:"Whoever unlawfully or negligently does an act which they know, or have reason to believe, is likely to spread the infection of a disease dangerous to life, shall be punished with imprisonment up to six months, or fine, or both.",punishment:"Up to six months, or fine, or both. Cognizable, bailable.",illustrations:[],crossRefs:[272]},{id:272,ipc:270,category:"UU",title:"Malignant act likely to spread infection of disease dangerous to life",text:"Whoever malignantly does an act which they know, or have reason to believe, is likely to spread the infection of a disease dangerous to life, shall be punished with imprisonment up to two years, or fine, or both.",simpleExplanation:"This is the aggravated version of Section 271 \u2014 same underlying conduct, but done malignantly (with actual ill-will or malice) rather than merely negligently, which is why the punishment jumps from six months to two years.",punishment:"Up to two years, or fine, or both. Cognizable, bailable.",illustrations:[],crossRefs:[271]},{id:273,ipc:271,category:"UU",title:"Disobedience to quarantine rule",text:"Whoever knowingly disobeys a Government rule for placing any mode of transport into quarantine, or regulating intercourse with a transport in quarantine, or regulating intercourse between places where an infectious disease prevails and other places, shall be punished with imprisonment up to six months, or fine, or both.",punishment:"Up to six months, or fine, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:274,ipc:272,category:"VV",title:"Adulteration of food or drink intended for sale",text:"Whoever adulterates an article of food or drink so as to make it noxious, intending to sell it as food/drink, or knowing it is likely to be so sold, shall be punished with imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[275]},{id:275,ipc:273,category:"VV",title:"Sale of noxious food or drink",text:"Whoever sells, or offers/exposes for sale, as food or drink, an article that has become noxious or unfit for food/drink, knowing or having reason to believe this, shall be punished with imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[274]},{id:276,ipc:274,category:"VV",title:"Adulteration of drugs",text:"Whoever adulterates a drug or medical preparation so as to lessen its efficacy, change its operation, or make it noxious, intending or knowing it likely that it will be sold/used for a medicinal purpose as if unadulterated, shall be punished with imprisonment up to one year, or fine up to \u20B95,000, or both.",punishment:"Up to one year, or fine up to \u20B95,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[277]},{id:277,ipc:275,category:"VV",title:"Sale of adulterated drugs",text:"Whoever, knowing a drug/medical preparation has been adulterated so as to lessen its efficacy, change its operation, or render it noxious, sells it, offers/exposes it for sale, or issues it from a dispensary as unadulterated, or causes it to be used medicinally by someone unaware of the adulteration, shall be punished with imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[276]},{id:278,ipc:276,category:"VV",title:"Sale of drug as a different drug or preparation",text:"Whoever knowingly sells, or offers/exposes for sale, or issues from a dispensary for medicinal purposes, a drug or medical preparation as a different drug or preparation, shall be punished with imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:279,ipc:277,category:"WW",title:"Fouling water of public spring or reservoir",text:"Whoever voluntarily corrupts or fouls the water of a public spring or reservoir, rendering it less fit for its ordinary use, shall be punished with imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Cognizable, bailable.",illustrations:[],crossRefs:[]},{id:280,ipc:278,category:"WW",title:"Making atmosphere noxious to health",text:"Whoever voluntarily vitiates the atmosphere of a place so as to make it noxious to the health of people generally dwelling, working, or passing along a public way nearby, shall be punished with fine up to \u20B91,000.",punishment:"Fine up to \u20B91,000. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:281,ipc:279,category:"WW",title:"Rash driving or riding on a public way",text:"Whoever drives or rides a vehicle on a public way so rashly or negligently as to endanger human life or be likely to cause hurt or injury, shall be punished with imprisonment up to six months, or fine up to \u20B91,000, or both.",punishment:"Up to six months, or fine up to \u20B91,000, or both. Cognizable, bailable.",illustrations:[],crossRefs:[]},{id:282,ipc:280,category:"WW",title:"Rash navigation of vessel",text:"Whoever navigates a vessel so rashly or negligently as to endanger human life or be likely to cause hurt or injury, shall be punished with imprisonment up to six months, or fine up to \u20B910,000, or both.",punishment:"Up to six months, or fine up to \u20B910,000, or both. Cognizable, bailable.",illustrations:[],crossRefs:[]},{id:283,ipc:281,category:"WW",title:"Exhibition of false light, mark or buoy",text:"Whoever exhibits a false light, mark, or buoy, intending or knowing it likely to mislead a navigator, shall be punished with imprisonment up to seven years, and fine not less than \u20B910,000.",punishment:"Up to seven years, and fine not less than \u20B910,000. Cognizable, bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[]},{id:284,ipc:282,category:"WW",title:"Conveying person by water for hire in unsafe or overloaded vessel",text:"Whoever knowingly or negligently conveys, or causes to be conveyed for hire, a person by water in a vessel that is in such a state, or so overloaded, as to endanger that person's life, shall be punished with imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Cognizable, bailable.",illustrations:[],crossRefs:[]},{id:285,ipc:283,category:"WW",title:"Danger or obstruction in public way or line of navigation",text:"Whoever, by an act or omission to take order with property in their possession/charge, causes danger, obstruction, or injury to a person in a public way or public line of navigation, shall be punished with fine up to \u20B95,000.",punishment:"Fine up to \u20B95,000. Cognizable, bailable.",illustrations:[],crossRefs:[]},{id:286,ipc:284,category:"WW",title:"Negligent conduct with respect to poisonous substance",text:"Whoever does, with a poisonous substance, an act so rash or negligent as to endanger human life or be likely to cause hurt/injury, or knowingly/negligently omits to take order with such a substance in their possession sufficient to guard against probable danger, shall be punished with imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Cognizable, bailable.",illustrations:[],crossRefs:[287,288]},{id:287,ipc:285,category:"WW",title:"Negligent conduct with respect to fire or combustible matter",text:"Whoever does, with fire or combustible matter, an act so rash or negligent as to endanger human life or be likely to cause hurt/injury, or knowingly/negligently omits to take order with such matter in their possession sufficient to guard against probable danger, shall be punished with imprisonment up to six months, or fine up to \u20B92,000, or both.",punishment:"Up to six months, or fine up to \u20B92,000, or both. Cognizable, bailable.",illustrations:[],crossRefs:[286,288]},{id:288,ipc:286,category:"WW",title:"Negligent conduct with respect to explosive substance",text:"Whoever does, with an explosive substance, an act so rash or negligent as to endanger human life or be likely to cause hurt/injury, or knowingly/negligently omits to take order with such a substance in their possession sufficient to guard against probable danger, shall be punished with imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Cognizable, bailable.",illustrations:[],crossRefs:[286,287]},{id:289,ipc:287,category:"WW",title:"Negligent conduct with respect to machinery",text:"Whoever does, with machinery, an act so rash or negligent as to endanger human life or be likely to cause hurt/injury, or knowingly/negligently omits to take order with machinery in their possession/care sufficient to guard against probable danger, shall be punished with imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:290,ipc:288,category:"WW",title:"Negligent conduct with respect to pulling down, repairing or constructing buildings, etc.",text:"Whoever, in pulling down, repairing, or constructing a building, knowingly or negligently omits to take sufficient measures to guard against probable danger to human life from its fall, shall be punished with imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Non-cognizable, bailable.",illustrations:[],crossRefs:[]},{id:291,ipc:289,category:"WW",title:"Negligent conduct with respect to animal",text:"Whoever knowingly or negligently omits to take sufficient measures with an animal in their possession to guard against probable danger to human life, or probable danger of grievous hurt, from it, shall be punished with imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Cognizable, bailable.",illustrations:[],crossRefs:[]},{id:292,ipc:290,category:"XX",title:"Punishment for public nuisance in cases not otherwise provided for",text:"Whoever commits a public nuisance not otherwise specifically punishable under this Sanhita shall be punished with fine up to \u20B91,000.",punishment:"Fine up to \u20B91,000. Non-cognizable, bailable.",illustrations:[],crossRefs:[270]},{id:293,ipc:291,category:"XX",title:"Continuance of nuisance after injunction to discontinue",text:"Whoever repeats or continues a public nuisance, having been enjoined by a public servant with lawful authority not to repeat or continue it, shall be punished with simple imprisonment up to six months, or fine up to \u20B95,000, or both.",punishment:"Up to six months, or fine up to \u20B95,000, or both. Cognizable, bailable.",illustrations:[],crossRefs:[270,292]},{id:294,ipc:292,category:"XX",title:"Sale, etc., of obscene books, etc.",text:"(1) A book, pamphlet, paper, drawing, painting, or other object (including electronic content) is deemed obscene if it is lascivious, appeals to prurient interest, or its effect (taken as a whole) tends to deprave and corrupt likely readers/viewers. (2) Selling, letting to hire, distributing, publicly exhibiting, or circulating (or making/possessing for those purposes) any obscene object; importing, exporting, or conveying it for such purposes; profiting from a business dealing in such objects; advertising such availability; or attempting any of these, is punishable on first conviction with imprisonment up to two years and fine up to \u20B95,000, and on subsequent conviction with imprisonment up to five years and fine up to \u20B910,000.",provisos:["Does not extend to a book/object whose publication is proved justified as being for the public good, on grounds of science, literature, art,
