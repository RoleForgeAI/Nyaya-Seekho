chapter:"XVII",label:"Of Fraudulent Deeds and Dispositions of Property",range:"320\u2013323"},{id:"MM",chapter:"XVII",label:"Of Mischief",range:"324\u2013328"},{id:"NN",chapter:"XVII",label:"Of Criminal Trespass",range:"329\u2013334"},{id:"OO",chapter:"XIII",label:"Summons, Information & Oaths",range:"206\u2013217"},{id:"PP",chapter:"XIII",label:"Obstruction, Threats & Public Function Contempt",range:"218\u2013226"},{id:"QQ",chapter:"XIV",label:"False Evidence",range:"227\u2013237"},{id:"RR",chapter:"XIV",label:"Screening Offenders & Obstructing Justice",range:"238\u2013254"},{id:"SS",chapter:"XIV",label:"Public Servants & Judicial Misconduct",range:"255\u2013261"},{id:"TT",chapter:"XIV",label:"Escape, Apprehension & Court Attendance",range:"262\u2013269"},{id:"UU",chapter:"XV",label:"Public Nuisance & Spread of Disease",range:"270\u2013273"},{id:"VV",chapter:"XV",label:"Adulteration of Food & Drugs",range:"274\u2013278"},{id:"WW",chapter:"XV",label:"Public Safety Negligence",range:"279\u2013291"},{id:"XX",chapter:"XV",label:"Nuisance Penalties, Obscenity & Lottery",range:"292\u2013297"}],Zd=[{id:1,ipc:null,category:"Y",title:"Short title, commencement and application",text:"(1) This Act may be called the Bharatiya Nyaya Sanhita, 2023. (2) It shall come into force on such date as the Central Government may, by notification, appoint \u2014 different dates may be appointed for different provisions. (3) Every person is liable to punishment under this Sanhita, and not otherwise, for every act or omission contrary to its provisions, of which they are guilty within India. (4) A person liable under Indian law to be tried for an offence committed beyond India shall be dealt with under this Sanhita as if the act were committed within India. (5) This Sanhita also applies to any offence committed by: any citizen of India outside India; any person on an Indian-registered ship or aircraft, wherever it may be; or any person outside India who commits an offence targeting a computer resource located in India. (6) Nothing in this Sanhita affects any Act punishing mutiny or desertion by armed-forces personnel, or any special or local law.",explanations:["'Offence' in this section includes every act committed outside India which, if committed in India, would be punishable under this Sanhita."],illustrations:["A, a citizen of India, commits a murder in a place outside India. He can be tried and convicted of murder in any place in India in which he may be found."],crossRefs:[]},{id:2,ipc:null,category:"Y",title:"Definitions",text:"This section defines 39 terms used throughout the Sanhita, unless the context otherwise requires. The most frequently relevant ones for study are individually searchable and appear as clickable definitions throughout this app (e.g. 'good faith', 'dishonestly', 'voluntarily', 'public servant', 'document'). Selected key definitions are listed below; see the Explanation panel for the full text of each.",explanations:["(1) 'act' \u2014 a series of acts is treated as a single act.","(2) 'animal' \u2014 any living creature other than a human being.","(3) 'child' \u2014 any person below eighteen years of age.","(4) 'counterfeit' \u2014 causing one thing to resemble another, intending or knowing it likely that deception will be practised by that resemblance.","(5) 'Court' \u2014 a Judge, or body of Judges, empowered by law to act judicially.","(6) 'death' \u2014 the death of a human being, unless the context indicates otherwise.","(7) 'dishonestly' \u2014 doing an act intending to cause wrongful gain to one person or wrongful loss to another.","(8) 'document' \u2014 any matter expressed on any substance by letters, figures, or marks, intended or usable as evidence.","(9) 'fraudulently' \u2014 doing a thing with intent to defraud, and not otherwise.","(10) 'gender' \u2014 'he' and its derivatives refer to any person, male, female, or transgender (per the Transgender Persons (Protection of Rights) Act, 2019).","(11) 'good faith' \u2014 nothing is done or believed in good faith if done without due care and attention.","(12) 'Government' \u2014 the Central Government or a State Government.","(13) 'harbour' \u2014 includes supplying shelter, food, money, arms, or transport, or otherwise helping a person evade apprehension.","(14) 'injury' \u2014 any harm illegally caused to a person in body, mind, reputation, or property.","(15) 'illegal' / 'legally bound to do' \u2014 'illegal' covers anything that is an offence, prohibited by law, or grounds for a civil action; a person is 'legally bound to do' whatever it would be illegal for them to omit.","(16) 'Judge' \u2014 a person officially designated as a Judge, or empowered to give a definitive (or appealable) judgment.","(17) 'life' \u2014 the life of a human being, unless context indicates otherwise.","(18) 'local law' \u2014 a law applicable only to a particular part of India.","(19) 'man' \u2014 a male human being of any age.","(20) 'month' / 'year' \u2014 reckoned by the Gregorian calendar.","(21) 'movable property' \u2014 property of every description except land and things attached to the earth.","(22) 'number' \u2014 singular includes plural and vice versa, unless context indicates otherwise.","(23) 'oath' \u2014 includes a solemn affirmation substituted by law for an oath.","(24) 'offence' \u2014 generally, an act made punishable by this Sanhita, with specific listed exceptions (e.g. Chapter III) where it also covers acts punishable under a special or local law.","(25) 'omission' \u2014 a series of omissions is treated as a single omission.","(26) 'person' \u2014 includes any company, association, or body of persons, whether incorporated or not.","(27) 'public' \u2014 includes any class of the public, or any community.","(28) 'public servant' \u2014 a detailed, specifically defined list: commissioned armed-forces officers, judges, government officers investigating offences or handling government property/documents, election officials, arbitrators, and anyone in government service or pay for a public duty, among others.","(29) 'reason to believe' \u2014 a person has 'reason to believe' a thing if they have sufficient cause to believe it, and not otherwise.","(30) 'special law' \u2014 a law applicable to a particular subject.","(31) 'valuable security' \u2014 a document by which a legal right is created, transferred, restricted, extinguished, or released, or a legal liability acknowledged.","(32) 'vessel' \u2014 anything made for conveying people or property by water.","(33) 'voluntarily' \u2014 causing an effect by means intended to cause it, or means known/believed likely to cause it.","(34) 'will' \u2014 any testamentary document.","(35) 'woman' \u2014 a female human being of any age.","(36) 'wrongful gain' \u2014 gain, by unlawful means, of property the gainer isn't legally entitled to.","(37) 'wrongful loss' \u2014 loss, by unlawful means, of property the loser is legally entitled to.","(38) 'gaining/losing wrongfully' \u2014 covers both wrongful retention/being kept out of property, and wrongful acquisition/deprivation.","(39) Undefined terms also used in the IT Act, 2000 or the BNSS, 2023 carry the meanings assigned there."],illustrations:[],crossRefs:[]},{id:3,ipc:null,category:"Y",title:"General explanations",text:"(1) Every offence definition, penal provision, and illustration in this Sanhita is understood subject to the General Exceptions (Chapter III), even where those exceptions aren't repeated. (2) A term explained in one Part of the Sanhita carries that meaning throughout. (3) Property in the possession of a person's spouse, clerk, or servant, on that person's account, is in that person's possession. (4) References to 'acts done' extend to illegal omissions too, unless context indicates otherwise. (5) When a criminal act is done by several people in furtherance of a common intention, each is liable as if they alone had done it. (6) When an act is criminal only because of a particular knowledge or intention, each person who joins in it with that knowledge/intention is liable as if they alone had done it. (7) Causing an effect partly by act and partly by omission is treated the same as causing it wholly by act or wholly by omission. (8) When an offence is committed by several acts, anyone who intentionally co-operates by doing any one of those acts is guilty of the offence. (9) Several people engaged in one criminal act may still be guilty of different offences by means of that act.",illustrations:["A police officer, without a warrant, apprehends Z, who has committed murder. The officer commits no wrongful confinement, since he was legally bound to apprehend Z \u2014 this falls within the General Exceptions even though not repeated in the wrongful-confinement provision.","A attacks Z under such grave and sudden provocation that his act would be only culpable homicide. B, bearing separate ill-will and not provoked, assists A in killing Z. B is guilty of murder; A is guilty only of culpable homicide \u2014 though both were engaged in the same act."],crossRefs:[]},{id:4,ipc:53,category:"Z",title:"Punishments",text:"The punishments to which offenders are liable under this Sanhita are: (1) Death; (2) Imprisonment for life, meaning imprisonment for the remainder of the person's natural life; (3) Imprisonment \u2014 of two kinds: (a) Rigorous, i.e. with hard labour; (b) Simple; (4) Forfeiture of property; (5) Fine; (6) Community Service.",ingredients:["Six categories exist: death, life imprisonment, imprisonment (rigorous or simple), forfeiture of property, fine, and community service (newly introduced by the BNS, not present in the IPC)"],illustrations:[],crossRefs:[]},{id:5,ipc:null,category:"Z",title:"Commutation of sentence",text:"The appropriate Government may, without the offender's consent, commute any punishment under this Sanhita to any other punishment, in accordance with Section 474 of the Bharatiya Nagarik Suraksha Sanhita, 2023.",explanations:["'Appropriate Government' means the Central Government, where the sentence is death or concerns a matter under Union executive power; otherwise, the State Government of the State where the offender is sentenced."],illustrations:[],crossRefs:[]},{id:6,ipc:57,category:"Z",title:"Fractions of terms of punishment",text:"In calculating fractions of terms of punishment, imprisonment for life is reckoned as equivalent to imprisonment for twenty years, unless otherwise provided.",illustrations:[],crossRefs:[]},{id:7,ipc:60,category:"Z",title:"Sentence may be (in certain cases of imprisonment) wholly or partly rigorous or simple",text:"Where an offender is punishable with imprisonment that may be of either description, the sentencing Court may direct that the imprisonment be wholly rigorous, wholly simple, or partly rigorous and partly simple.",illustrations:[],crossRefs:[]},{id:8,ipc:63,category:"Z",title:"Amount of fine, liability in default of payment of fine, etc.",text:"(1) Where no upper limit is stated for a fine, the amount is unlimited but must not be excessive. (2) Where an offender is sentenced to a fine, the Court may direct that, in default of payment, the offender suffers imprisonment in addition to any other sentence. (3) Default imprisonment must not exceed one-fourth of the maximum imprisonment term fixed for the offence, where the offence carries both imprisonment and fine. (4) Default imprisonment may be of any description available for the offence. (5) Where the offence carries only a fine or community service, default imprisonment is simple, capped at two months (fines up to \u20B95,000), four months (fines up to \u20B910,000), or one year (any other case). (6) Default imprisonment ends once the fine is paid or levied, or proportionally if part-paid. (7) The fine may be levied within six years of sentencing (or the full sentence period, if longer) \u2014 the offender's death does not discharge property that remains legally liable for their debts.",illustrations:["A is fined \u20B91,000 with four months' imprisonment in default. If \u20B9750 is paid before one month of imprisonment has passed, A is discharged as soon as that month ends. If \u20B9500 is paid before two months have passed, A is discharged once those two months are completed."],crossRefs:[]},{id:9,ipc:71,category:"Z",title:"Limit of punishment of offence made up of several offences",text:"(1) Where an offence is made up of parts, each of which is itself an offence, the offender is not punished for more than one of those offences, unless expressly provided otherwise. (2) Where an act falls within two or more separate legal definitions, or where several acts (each potentially an offence alone) combine into a different offence, the offender is not punished more severely than the Court could award for any single one of those offences.",illustrations:["A gives Z fifty strokes with a stick. Though each blow could be a separate act of causing hurt, A is liable to only one punishment for the whole beating, not fifty.","While A is beating Z, Y interferes, and A intentionally strikes Y too. Since the blow to Y is no part of the act against Z, A is liable to separate punishments \u2014 one for each victim."],crossRefs:[]},{id:10,ipc:72,category:"Z",title:"Punishment of person guilty of one of several offences, judgment stating that it is doubtful of which",text:"Where a judgment finds a person guilty of one of several specified offences, but it is doubtful which, the offender is punished for the offence carrying the lowest punishment, if the offences don't all carry the same punishment.",illustrations:[],crossRefs:[]},{id:11,ipc:73,category:"Z",title:"Solitary confinement",text:"Where a Court has power to sentence an offender to rigorous imprisonment, it may order solitary confinement for part of that sentence, up to three months total, on this scale: up to one month, if the total term doesn't exceed six months; up to two months, if the term exceeds six months but not one year; up to three months, if the term exceeds one year.",illustrations:[],crossRefs:[12]},{id:12,ipc:74,category:"Z",title:"Limit of solitary confinement",text:"Solitary confinement must never exceed fourteen days at a time, with intervals between periods of at least equal length. Where the total imprisonment exceeds three months, solitary confinement must not exceed seven days in any one month of the sentence, again with intervals of at least equal length.",illustrations:[],crossRefs:[11]},{id:13,ipc:75,category:"Z",title:"Enhanced punishment for certain offences after previous conviction",text:"Whoever, having already been convicted in India of an offence under Chapter X or Chapter XVII of this Sanhita, punishable with three or more years' imprisonment, is subsequently convicted of any offence under either of those Chapters carrying the same term, is liable for every such subsequent offence to imprisonment for life, or imprisonment up to ten years.",illustrations:[],crossRefs:[]},{id:14,ipc:76,category:"A",title:"Act done by a person bound, or by mistake of fact believing himself bound, by law",text:"Nothing is an offence which is done by a person who is, or who by reason of a mistake of fact and not by reason of a mistake of law in good faith believes himself to be, bound by law to do it.",illustrations:["A, a soldier, fires on a mob by the order of his superior officer, in conformity with the commands of the law. A has committed no offence.","A, an officer of a Court, being ordered by that Court to arrest Y, and after due enquiry, believing Z to be Y, arrests Z. A has committed no offence."],crossRefs:[]},{id:15,ipc:77,category:"A",title:"Act of Judge when acting judicially",text:"Nothing is an offence which is done by a Judge when acting judicially in the exercise of any power which is, or which in good faith he believes to be, given to him by law.",illustrations:[],crossRefs:[]},{id:16,ipc:78,category:"A",title:"Act done pursuant to the judgment or order of Court",text:"Nothing which is done in pursuance of, or which is warranted by the judgment or order of, a Court, if done whilst such judgment or order remains in force, is an offence \u2014 notwithstanding the Court may have had no jurisdiction to pass it \u2014 provided the person doing the act in good faith believes the Court had such jurisdiction.",illustrations:[],crossRefs:[]},{id:17,ipc:79,category:"A",title:"Act done by a person justified, or by mistake of fact believing himself justified, by law",text:"Nothing is an offence which is done by any person who is justified by law, or who by reason of a mistake of fact and not by reason of a mistake of law in good faith believes himself to be justified by law, in doing it.",illustrations:["A sees Z commit what appears to A to be a murder. A, in the exercise, to the best of his judgment exerted in good faith, of the power the law gives to all persons to apprehend murderers, seizes Z to bring him before the proper authorities. A has committed no offence, though it may turn out Z was acting in self-defence."],crossRefs:[]},{id:18,ipc:80,category:"B",title:"Accident in doing a lawful act",text:"Nothing is an offence which is done by accident or misfortune, and without any criminal intention or knowledge, in the doing of a lawful act in a lawful manner by lawful means and with proper care and caution.",illustrations:["A is at work with a hatchet; the head flies off and kills a man standing by. If there was no want of proper caution on A's part, his act is excusable and not an offence."],ingredients:["The act was done by accident or misfortune","No criminal intention or knowledge of causing harm","The underlying act itself was lawful","It was done in a lawful manner, by lawful means","Proper care and caution were exercised"],crossRefs:[]},{id:19,ipc:81,category:"B",title:"Act likely to cause harm, but done without criminal intent, and to prevent other harm",text:"Nothing is an offence merely by reason of its being done with the knowledge that it is likely to cause harm, if it be done without any criminal intention to cause harm, and in good faith for the purpose of preventing or avoiding other harm to person or property.",explanations:["It is a question of fact whether the harm to be prevented was of such a nature and so imminent as to justify or excuse the risk of doing the act with the knowledge that it was likely to cause harm."],illustrations:["A, the captain of a vessel, must inevitably run down a boat B carrying twenty or thirty passengers unless he changes course \u2014 but changing course risks running down a smaller boat C carrying two. If A alters course without intending to run down C, and in good faith to avoid danger to B's passengers, he is not guilty even if he runs down C.","A, in a great fire, pulls down houses to stop it spreading, in good faith intending to save life or property. If the harm prevented was serious and imminent enough to justify it, A is not guilty."],crossRefs:[]},{id:20,ipc:82,category:"C",title:"Act of a child under seven years of age",text:"Nothing is an offence which is done by a child under seven years of age.",ingredients:["The accused is a child","The child was under seven years of age at the time of the act"],illustrations:[],crossRefs:[]},{id:21,ipc:83,category:"C",title:"Act of a child above seven and under twelve of immature understanding",text:"Nothing is an offence which is done by a child above seven years of age and under twelve, who has not attained sufficient maturity of understanding to judge the nature and consequences of his conduct on that occasion.",illustrations:[],crossRefs:[]},{id:22,ipc:84,category:"C",title:"Act of a person of unsound mind",text:"Nothing is an offence which is done by a person who, at the time of doing it, by reason of mental illness, is incapable of knowing the nature of the act, or that he is doing what is either wrong or contrary to law.",ingredients:["The accused had a mental illness (legal, not merely medical, insanity)","This existed at the time of doing the act","It made him incapable of knowing the nature of the act, OR incapable of knowing it was wrong or contrary to law"],illustrations:[],crossRefs:[],cases:[{name:"Surendra Mishra v. State of Jharkhand",cite:"(2011) 11 SCC 495",year:2011,ratio:"The Supreme Court held this section protects legal insanity, not medical insanity \u2014 every person with a mental disease is not automatically exempt. The accused must prove unsoundness of mind on a preponderance of probabilities, not beyond reasonable doubt.",url:"https://indiankanoon.org/doc/1259566/"}]},{id:23,ipc:85,category:"D",title:"Act of a person incapable of judgment by reason of intoxication caused against his will",text:"Nothing is an offence which is done by a person who, at the time of doing it, is by reason of intoxication incapable of knowing the nature of the act, or that he is doing what is either wrong or contrary to law \u2014 provided the thing which intoxicated him was administered without his knowledge or against his will.",illustrations:[],crossRefs:[]},{id:24,ipc:86,category:"D",title:"Offence requiring a particular intent or knowledge committed by one who is intoxicated",text:"Where an act is not an offence unless done with a particular knowledge or intent, a person who does the act while intoxicated is liable to be dealt with as if he had the same knowledge he would have had if not intoxicated \u2014 unless the thing that intoxicated him was administered without his knowledge or against his will.",illustrations:[],crossRefs:[]},{id:25,ipc:87,category:"E",title:"Act not intended and not known to be likely to cause death or grievous hurt, done by consent",text:"Nothing not intended to cause death or grievous hurt, and not known by the doer to be likely to do so, is an offence by reason of any harm it may cause to any person above eighteen who has given consent, express or implied, to suffer that harm or take the risk of it.",illustrations:["A and Z agree to fence with each other for amusement. This implies consent of each to suffer any harm which, in the course of fair play, may be caused; if A, playing fairly, hurts Z, A commits no offence."],crossRefs:[]},{id:26,ipc:88,category:"E",title:"Act not intended to cause death, done by consent in good faith for person's benefit",text:"Nothing not intended to cause death is an offence by reason of any harm it may cause to a person for whose benefit it is done in good faith, who has consented, express or implied, to suffer that harm or take the risk of it.",illustrations:["A, a surgeon, knowing an operation is likely to cause Z's death but not intending it, and acting in good faith for Z's benefit, performs the operation with Z's consent. A commits no offence."],crossRefs:[]},{id:27,ipc:89,category:"E",title:"Act done in good faith for benefit of child or person with unsound mind, by or with consent of guardian",text:"Nothing done in good faith for the benefit of a person under twelve, or a person with mental illness, by or with the consent of their guardian, is an offence by reason of any harm it may cause to that person.",provisos:["the intentional causing of death, or the attempting to cause death;","doing anything known to be likely to cause death, for any purpose other than preventing death or grievous hurt, or curing a grievous disease or infirmity;","the voluntary causing of grievous hurt, or attempting it, unless to prevent death or grievous hurt, or to cure a grievous disease or infirmity;","the abetment of any offence to which this exception would not otherwise extend."],illustrations:["A, in good faith, for his child's benefit and without the child's consent, has the child operated on by a surgeon knowing the operation may cause death but not intending it. A is within the exception, as his object was the child's cure."],crossRefs:[]},{id:28,ipc:90,category:"E",title:"Consent known to be given under fear or misconception",text:"A consent is not such a consent as is intended by any section of this Sanhita \u2014 (a) if given under fear of injury or a misconception of fact, and the person doing the act knows or has reason to believe this; or (b) if given by a person who, from mental illness or intoxication, cannot understand the nature and consequence of what they consent to; or (c) unless the context shows otherwise, if given by a person under twelve years of age.",illustrations:[],crossRefs:[]},{id:29,ipc:91,category:"E",title:"Exclusion of acts which are offences independently of harm caused",text:"The exceptions in sections 21, 22 and 23 do not extend to acts which are offences independently of any harm they may cause, or be intended or known to be likely to cause, to the person giving the consent.",illustrations:["Causing miscarriage (unless in good faith to save the woman's life) is an offence independently of any harm it may cause. It is therefore not an offence 'by reason of such harm', so the woman's or guardian's consent does not justify the act."],crossRefs:[21,22,23]},{id:30,ipc:92,category:"E",title:"Act done in good faith for benefit of a person without consent",text:"Nothing is an offence by reason of any harm it may cause to a person for whose benefit it is done in good faith, even without that person's consent, if it is impossible for them to signify consent, or if they are incapable of consenting and have no guardian from whom consent could be obtained in time.",provisos:["the intentional causing of death, or attempting to cause death;","doing anything known to be likely to cause death, for any purpose other than preventing death or grievous hurt, or curing a grievous disease or infirmity;","the voluntary causing of hurt, or attempting it, for any purpose other than preventing death or hurt;","the abetment of any offence to which this exception would not otherwise extend."],explanations:["Mere pecuniary benefit is not \u2018benefit\u2019 within the meaning of this exception."],illustrations:["Z is thrown from his horse and left insensible. A, a surgeon, finds Z requires trepanning. Not intending death but acting in good faith for Z's benefit, A operates before Z can consent. A commits no offence.","A is in a burning house with Z, a child. People below hold out a blanket. A drops the child, knowing the fall may kill it but not intending to, and in good faith intending the child's benefit. Even if the child dies, A commits no offence."],crossRefs:[]},{id:31,ipc:93,category:"E",title:"Communication made in good faith",text:"No communication made in good faith is an offence by reason of any harm to the person to whom it is made, if it is made for that person's benefit.",illustrations:["A, a surgeon, in good faith, tells a patient he cannot live. The patient dies from the shock. A commits no offence, though he knew the communication might cause this."],crossRefs:[]},{id:32,ipc:94,category:"F",title:"Act to which a person is compelled by threats",text:"Except murder, and offences against the State punishable with death, nothing is an offence which is done by a person compelled to do it by threats which, at the time, reasonably cause the apprehension that instant death to that person will otherwise follow.",provisos:["the person doing the act did not, of their own accord, or from reasonable apprehension of harm short of instant death, place themselves in the situation that led to the constraint."],explanations:["A person who, of their own accord or by threat of being beaten, joins a gang of dacoits knowing their character, cannot claim this exception on the ground of having been compelled by associates to commit an offence.","A person seized by a gang of dacoits and forced, under threat of instant death, to do an act that is an offence \u2014 e.g., a smith compelled to force open a door for the dacoits to plunder \u2014 is entitled to this exception."],illustrations:[],crossRefs:[]},{id:33,ipc:95,category:"F",title:"Act causing slight harm",text:"Nothing is an offence by reason that it causes, or is intended or known to be likely to cause, any harm, if that harm is so slight that no person of ordinary sense and temper would complain of it.",illustrations:[],crossRefs:[]},{id:34,ipc:96,category:"G",title:"Things done in private defence",text:"Nothing is an offence which is done in the exercise of the right of private defence.",illustrations:[],crossRefs:[]},{id:35,ipc:97,category:"G",title:"Right of private defence of the body and of property",text:"Every person has a right, subject to the restrictions in section 37, to defend \u2014 (1) his own body, and the body of any other person, against any offence affecting the human body; (2) the property, movable or immovable, of himself or any other person, against theft, robbery, mischief or criminal trespass, or an attempt to commit any of these.",ingredients:["There must be an offence (actual or attempted) affecting the body or property","The defence must be exercised against that offence","Subject at all times to the restrictions in Section 37 (no more harm than necessary; not against a public servant acting lawfully; not where time exists to seek public authorities)"],illustrations:[],crossRefs:[37],cases:[{name:"Darshan Singh v. State of Punjab",cite:"AIR 2010 SC 1212",year:2010,ratio:"The Supreme Court laid down guidelines on the right of private defence, holding it is available to every citizen and should not require a person facing an imminent attack to behave like a coward.",url:"https://indiankanoon.org/doc/1748156/"}]},{id:36,ipc:98,category:"G",title:"Right of private defence against the act of a person with unsound mind, etc.",text:"When an act which would otherwise be a certain offence is not that offence, by reason of the youth, immaturity, mental illness or intoxication of the doer, or a misconception on their part, every person has the same right of private defence against that act as if it were that offence.",illustrations:["Z, under the influence of mental illness, attempts to kill A. Z commits no offence, but A has the same right of private defence as if Z were sane.","A enters at night a house he is legally entitled to enter. Z, mistaking A for a house-breaker, attacks him in good faith. Z commits no offence, but A still has the same right of private defence against Z."],crossRefs:[]},{id:37,ipc:99,category:"G",title:"Acts against which there is no right of private defence",text:"There is no right of private defence against an act not reasonably causing apprehension of death or grievous hurt, done (or attempted) by a public servant acting in good faith under colour of office, or under such a public servant's direction \u2014 even if not strictly justifiable by law \u2014 nor in cases where there is time to seek the protection of the public authorities. The right never extends to inflicting more harm than is necessary for the purpose of defence.",explanations:["A person is not deprived of the right of private defence against a public servant's act unless they know or have reason to believe the person is such a public servant.","A person is not deprived of the right against an act done by the direction of a public servant unless they know or have reason to believe this, or the authority is not produced when demanded."],illustrations:[],crossRefs:[]},{id:38,ipc:100,category:"G",title:"When the right of private defence of the body extends to causing death",text:"The right of private defence of the body extends, under the restrictions in section 37, to voluntarily causing death or any other harm to the assailant, if the offence is: an assault reasonably causing apprehension of death or of grievous hurt; an assault with intent to commit rape, or to gratify unnatural lust, or to kidnap or abduct; an assault intending wrongful confinement under circumstances giving no recourse to public authorities; or throwing or attempting to throw acid causing reasonable apprehension of grievous hurt.",ingredients:["The assault falls within one of the specified grave categories (death/grievous hurt, rape, unnatural lust, kidnap/abduction, certain confinement, or acid attack)","The apprehension of harm was reasonable, judged from the defender's position","The response stayed within the Section 37 restrictions on proportionality"],illustrations:[],crossRefs:[37],cases:[{name:"Darshan Singh v. State of Punjab",cite:"AIR 2010 SC 1212",year:2010,ratio:"The Court held the right of private defence can extend to causing death where the accused's response was proportionate to a real and imminent threat of death or grievous hurt.",url:"https://indiankanoon.org/doc/1748156/"}]},{id:39,ipc:101,category:"G",title:"When such right extends to causing any harm other than death",text:"If the offence is not of a description specified in section 38, the right of private defence of the body does not extend to voluntarily causing death to the assailant, but does extend, under the restrictions in section 37, to voluntarily causing any harm other than death.",illustrations:[],crossRefs:[37,38]},{id:40,ipc:102,category:"G",title:"Commencement and continuance of the right of private defence of the body",text:"The right of private defence of the body commences as soon as a reasonable apprehension of danger arises from an attempt or threat to commit the offence, though the offence may not yet have been committed, and continues as long as that apprehension continues.",illustrations:[],crossRefs:[]},{id:41,ipc:103,category:"G",title:"When the right of private defence of property extends to causing death",text:"The right of private defence of property extends, under the restrictions in section 37, to voluntarily causing death or any other harm to the wrong-doer, if the offence is: robbery; house-breaking after sunset and before sunrise; mischief by fire or explosive substance on a dwelling or place used for custody of property; or theft, mischief or house-trespass under circumstances reasonably causing apprehension that death or grievous hurt will follow if the right is not exercised.",illustrations:[],crossRefs:[37]},{id:42,ipc:104,category:"G",title:"When such right extends to causing any harm other than death",text:"If the offence is theft, mischief or criminal trespass not of the descriptions in section 41, the right does not extend to voluntarily causing death, but does extend, subject to the restrictions in section 37, to voluntarily causing the wrong-doer any harm other than death.",illustrations:[],crossRefs:[41,37]},{id:43,ipc:105,category:"G",title:"Commencement and continuance of the right of private defence of property",text:"The right of private defence of property commences when a reasonable apprehension of danger to the property arises; against theft, continues till the offender effects retreat with the property or public assistance is obtained or the property is recovered; against robbery, continues as long as the offender causes or attempts death, hurt or wrongful restraint, or the fear of these continues; against criminal trespass or mischief, continues as long as it is being committed; against house-breaking after sunset and before sunrise, continues as long as the house-trespass thereby begun continues.",illustrations:[],crossRefs:[]},{id:44,ipc:106,category:"G",title:"Right of private defence against deadly assault when there is risk of harm to innocent person",text:"If, in exercising the right of private defence against an assault reasonably causing apprehension of death, the defender cannot effectually exercise that right without risk of harm to an innocent person, the right of private defence extends to running that risk.",illustrations:["A is attacked by a mob attempting to murder him. He cannot exercise his right of private defence without firing on the mob, and cannot fire without risk of harming young children mixed in with it. A commits no offence if, by firing, he harms any of the children."],crossRefs:[]},{id:45,ipc:107,category:"H",title:"Abetment of a thing",text:"A person abets the doing of a thing, who: (1) instigates any person to do that thing; or (2) engages with one or more other persons in any conspiracy for the doing of that thing, if an act or illegal omission takes place in pursuance of that conspiracy and in order to the doing of that thing; or (3) intentionally aids, by any act or illegal omission, the doing of that thing.",explanations:["A person who, by wilful misrepresentation or wilful concealment of a material fact which he is bound to disclose, voluntarily causes or procures a thing to be done, is said to instigate the doing of that thing.","Whoever, prior to or at the time of the commission of an act, does anything to facilitate its commission, and thereby facilitates it, is said to aid the doing of that act."],illustrations:["A, a public officer, is authorised by a warrant to apprehend Z. B, knowing this and that C is not Z, wilfully represents to A that C is Z, thereby intentionally causing A to apprehend C. B abets by instigation the apprehension of C."],ingredients:["Instigating any person to do a thing, OR","Engaging in a conspiracy for doing it, with an act or illegal omission done in pursuance of that conspiracy, OR","Intentionally aiding the doing of it, by act or illegal omission"],crossRefs:[],cases:[{name:"Ramesh Kumar v. State of Chhattisgarh",cite:"(2001) 9 SCC 618",year:2001,ratio:"The Supreme Court held that instigation means to goad, urge, provoke, incite or encourage the doing of an act, with a reasonable certainty to incite the consequence; mere words uttered in anger or emotion, without intending the consequence, do not amount to instigation.",url:"https://indiankanoon.org/doc/229273/"}]},{id:46,ipc:108,category:"H",title:"Abettor",text:"A person abets an offence, who abets either the commission of an offence, or the commission of an act which would be an offence if committed by a person capable by law of committing an offence, with the same intention or knowledge as that of the abettor.",explanations:["The abetment of the illegal omission of an act may amount to an offence although the abettor may not himself be bound to do that act.","To constitute abetment it is not necessary that the act abetted actually be committed, or that the effect requisite to constitute the offence be caused.","It is not necessary that the person abetted be capable by law of committing an offence, or share the abettor's guilty intention or knowledge, or have any guilty intention or knowledge at all.","The abetment of an offence being itself an offence, the abetment of such an abetment is also an offence.","It is not necessary to abetment by conspiracy that the abettor concert the offence with the person who commits it \u2014 it is enough that he engages in the conspiracy in pursuance of which the offence is committed."],illustrations:["A instigates B to murder C. B refuses. A is still guilty of abetting B to commit murder.","A, with the intention of murdering Z, instigates B, a child under seven, to do an act causing Z's death. B does the act in A's absence. Though B was not capable by law of committing an offence, A is liable as if he had committed murder himself.","A instigates B to instigate C to murder Z. B instigates C, and C commits the murder in consequence. Both B and A are liable to the punishment for murder."],crossRefs:[]},{id:47,ipc:"108A",category:"H",title:"Abetment in India of offences outside India",text:"A person abets an offence within the meaning of this Sanhita who, in India, abets the commission of any act without and beyond India which would constitute an offence if committed in India.",illustrations:["A, in India, instigates B, a foreigner in country X, to commit a murder in that country. A is guilty of abetting murder."],crossRefs:[]},{id:48,ipc:null,category:"H",title:"Abetment outside India for offence in India",text:"A person abets an offence within the meaning of this Sanhita who, without and beyond India, abets the commission of any act in India which would constitute an offence if committed in India.",illustrations:["A, in country X, instigates B to commit a murder in India. A is guilty of abetting murder."],crossRefs:[]},{id:49,ipc:109,category:"I",title:"Punishment of abetment if the act abetted is committed in consequence and no express provision is made for its punishment",text:"Whoever abets any offence shall, if the act abetted is committed in consequence of the abetment, and no express provision is made by this Sanhita for the punishment of such abetment, be punished with the punishment provided for the offence.",explanations:["An act or offence is said to be committed in consequence of abetment when it is committed in consequence of the instigation, or in pursuance of the conspiracy, or with the aid which constitutes the abetment."],illustrations:["A and B conspire to poison Z. A procures the poison and delivers it to B, who administers it to Z in A's absence, causing Z's death. B is guilty of murder; A is guilty of abetting that murder by conspiracy, and liable to the same punishment."],crossRefs:[]},{id:50,ipc:110,category:"I",title:"Punishment of abetment if person abetted does act with different intention from that of abettor",text:"Whoever abets the commission of an offence shall, if the person abetted does the act with a different intention or knowledge from that of the abettor, be punished with the punishment provided for the offence which would have been committed if the act had been done with the intention or knowledge of the abettor and no other.",illustrations:[],crossRefs:[]},{id:51,ipc:111,category:"I",title:"Liability of abettor when one act abetted and different act done",text:"When an act is abetted and a different act is done, the abettor is liable for the act done in the same manner as if he had directly abetted it \u2014 provided the act done was a probable consequence of the abetment, and was committed under the influence of the instigation, or with the aid or in pursuance of the conspiracy which constituted the abetment.",illustrations:["A instigates B and C to break into a house at midnight for robbery and gives them arms. Resisted by Z, an inmate, they murder Z. If the murder was a probable consequence of the abetment, A is liable to the punishment for murder.","A instigates B to burn Z's house; B sets fire to it and also commits theft there. A is guilty of abetting the burning, but not the theft, since the theft was a distinct act, not a probable consequence."],crossRefs:[]},{id:52,ipc:112,category:"I",title:"Abettor when liable to cumulative punishment for act abetted and for act done",text:"If the act for which the abettor is liable under section 51 is committed in addition to the act abetted, and constitutes a distinct offence, the abettor is liable to punishment for each of the offences.",illustrations:["A instigates B to resist by force a distress made by a public servant. B resists, and in doing so voluntarily causes grievous hurt to the officer. B is liable for both resisting the distress and causing grievous hurt; if A knew grievous hurt was likely, A is liable for both offences too."],crossRefs:[51]},{id:53,ipc:113,category:"I",title:"Liability of abettor for an effect caused by the act abetted different from that intended by the abettor",text:"When an act is abetted with the intention of causing a particular effect, and the act for which the abettor is liable causes a different effect from that intended, the abettor is liable for the effect actually caused in the same manner as if he had abetted the act intending that effect \u2014 provided he knew the act abetted was likely to cause it.",illustrations:["A instigates B to cause grievous hurt to Z. B causes grievous hurt, and Z dies of it. If A knew the grievous hurt abetted was likely to cause death, A is liable to the punishment for murder."],crossRefs:[]},{id:54,ipc:114,category:"I",title:"Abettor present when offence is committed",text:"Whenever a person who, if absent, would be liable to be punished as an abettor is present when the act or offence for which he would be so punishable is committed, he shall be deemed to have committed such act or offence.",illustrations:[],crossRefs:[]},{id:55,ipc:115,category:"J",title:"Abetment of offence punishable with death or imprisonment for life",text:"(1) Whoever abets the commission of an offence punishable with death or imprisonment for life shall, if that offence is not committed in consequence of the abetment, and no express provision is made under this Sanhita for the punishment of such abetment, be punished with imprisonment of either description up to seven years, and shall also be liable to fine. (2) If any act for which the abettor is liable in consequence of the abetment, and which causes hurt to any person, is done, the abettor shall be liable to imprisonment up to fourteen years, and shall also be liable to fine.",illustrations:["A instigates B to murder Z. The offence is not committed. A is liable to imprisonment up to seven years and a fine; if any hurt is caused to Z in consequence of the abetment, A is liable to imprisonment up to fourteen years and a fine."],crossRefs:[]},{id:56,ipc:116,category:"J",title:"Abetment of offence punishable with imprisonment",text:"(1) Whoever abets an offence punishable with imprisonment shall, if that offence is not committed in consequence of the abetment, and no express provision is made by this Sanhita for the punishment of such abetment, be punished with imprisonment up to one-fourth of the longest term provided for that offence, or with such fine as is provided for that offence, or with both. (2) If the abettor or the person abetted is a public servant whose duty it is to prevent the offence, the abettor shall be punished with imprisonment up to one-half of the longest term provided for that offence, or with such fine, or with both.",illustrations:["A, a police officer whose duty it is to prevent robbery, abets the commission of robbery. Though the robbery is not committed, A is liable to one-half of the longest term of imprisonment provided for robbery, and also to fine."],crossRefs:[]},{id:57,ipc:117,category:"J",title:"Abetting commission of offence by the public or by more than ten persons",text:"Whoever abets the commission of an offence by the public generally, or by any number or class of persons exceeding ten, shall be punished with imprisonment of either description for a term which may extend to seven years and with fine.",illustrations:["A affixes in a public place a placard instigating a sect of more than ten members to attack members of an adverse sect during a procession. A has committed the offence defined in this section."],crossRefs:[]},{id:58,ipc:118,category:"J",title:"Concealing design to commit offence punishable with death or imprisonment for life",text:"Whoever, intending to facilitate or knowing it likely that he will thereby facilitate the commission of an offence punishable with death or imprisonment for life, voluntarily conceals \u2014 by act, illegal omission, or use of encryption or any information-hiding tool \u2014 the existence of a design to commit such offence, or makes a representation he knows to be false about that design, shall (1) if the offence is committed, be punished with imprisonment up to seven years; or (2) if the offence is not committed, with imprisonment up to three years, and shall also be liable to fine.",illustrations:["A, knowing that a dacoity is about to be committed at B, falsely informs the Magistrate it will occur at C, misleading him with intent to facilitate the offence. The dacoity is committed at B. A is punishable under this section."],crossRefs:[]},{id:59,ipc:119,category:"J",title:"Public servant concealing design to commit offence which it is his duty to prevent",text:"Whoever, being a public servant, intending to facilitate or knowing it likely that he will thereby facilitate the commission of an offence which it is his duty to prevent, voluntarily conceals \u2014 by act, illegal omission, or use of encryption or any information-hiding tool \u2014 the existence of a design to commit it, or makes a false representation about it, shall be punished on a graded scale depending on whether the offence is committed, and the severity of the offence concealed.",illustrations:["A, a police officer legally bound to report designs to commit robbery, knows B designs to commit robbery but omits to report it, intending to facilitate the offence. A is liable under this section."],crossRefs:[]},{id:60,ipc:120,category:"J",title:"Concealing design to commit offence punishable with imprisonment",text:"Whoever, intending to facilitate or knowing it likely that he will thereby facilitate the commission of an offence punishable with imprisonment, voluntarily conceals, by act or illegal omission, the existence of a design to commit it, or makes a false representation about it, shall be punished with imprisonment up to one-fourth of the longest term provided for the offence if it is committed, or up to one-eighth if it is not, or with fine, or both.",illustrations:[],crossRefs:[]},{id:61,ipc:"120A/120B",category:"K",title:"Criminal conspiracy",text:"When two or more persons agree to do, or cause to be done \u2014 (a) an illegal act; or (b) an act which is not illegal, by illegal means \u2014 such an agreement is designated a criminal conspiracy: Provided that no agreement except an agreement to commit an offence shall amount to a criminal conspiracy unless some act besides the agreement is done by one or more parties in pursuance thereof. Whoever is a party to a criminal conspiracy to commit an offence punishable with death, imprisonment for life, or rigorous imprisonment for two years or upwards shall, where no express provision is made for the punishment of such a conspiracy, be punished as if he had abetted such offence; any other criminal conspiracy is punishable with imprisonment up to six months, or fine, or both.",explanations:["It is immaterial whether the illegal act is the ultimate object of the agreement, or merely incidental to it."],ingredients:["An agreement between two or more persons","The agreement is to do an illegal act, or a legal act by illegal means","For conspiracies other than to commit an offence, some overt act beyond the agreement itself, done by a party in pursuance of it"],illustrations:[],crossRefs:[],cases:[{name:"State of Maharashtra v. Som Nath Thapa",cite:"(1996) 4 SCC 659",year:1996,ratio:"The Supreme Court held that to establish criminal conspiracy, knowledge of the illegal act or illegal means is essential; intent may be inferred from knowledge itself where the goods or services involved have no legitimate use.",url:"https://indiankanoon.org/doc/702724/"}]},{id:62,ipc:511,category:"L",title:"Punishment for attempting to commit offences punishable with imprisonment for life or other imprisonment",text:"Whoever attempts to commit an offence punishable by this Sanhita with imprisonment for life or imprisonment, or to cause such an offence to be committed, and in such attempt does any act towards the commission of the offence, shall, where no express provision is made by this Sanhita for the punishment of such attempt, be punished with imprisonment of any description provided for the offence, for a term up to one-half of the imprisonment for life or, as the case may be, one-half of the longest term of imprisonment provided for that offence, or with such fine as is provided for the offence, or with both.",ingredients:["Intention to commit an offence punishable with imprisonment (or imprisonment for life)","Doing some act towards the commission of that offence \u2014 going beyond mere preparation","The offence itself is not actually completed"],illustrations:["A attempts to steal jewels by breaking open a box, and finds after opening it that there is no jewel inside. He has done an act towards the commission of theft, and is guilty under this section.","A attempts to pick Z's pocket by thrusting his hand into it, but fails because Z's pocket is empty. A is guilty under this section."],crossRefs:[]},{id:63,ipc:375,category:"T",title:"Rape",text:"A man is said to commit 'rape' if he \u2014 (a) penetrates his penis, to any extent, into the vagina, mouth, urethra or anus of a woman or makes her do so with him or any other person; or (b) inserts, to any extent, any object or body part (not the penis) into the vagina, urethra or anus of a woman, or makes her do so; or (c) manipulates any part of a woman's body so as to cause penetration into the vagina, urethra, anus, or any part of her body, or makes her do so; or (d) applies his mouth to the vagina, anus, or urethra of a woman, or makes her do so \u2014 under any of the following seven circumstances: against her will; without her consent; with consent obtained by putting her (or someone she is interested in) in fear of death or hurt; with consent obtained by impersonating her husband; with consent given while unable to understand the nature and consequences of the act due to mental illness, intoxication, or a stupefying substance administered to her; with or without consent, when she is under eighteen; or when she is unable to communicate consent.",simpleExplanation:"The definition has two parts, and both must be met. First, one of four physical acts (clauses a\u2013d) \u2014 the definition is broader than penile-vaginal penetration alone. Second, one of seven circumstances showing the act wasn't a freely consenting adult encounter \u2014 absence of will/consent, coerced or tricked consent, incapacity to consent, or the woman being under eighteen (where consent is irrelevant either way). Exception 2 (marital rape) is narrower than it looks \u2014 it only shields a husband where the wife is not a minor; Independent Thought is why that age line is drawn at eighteen.",punishment:"Base punishment: rigorous imprisonment of ten years to life, and fine (Section 64(1)). Aggravated circumstances \u2014 custodial rape, rape by a person in a position of trust, rape during communal violence, or on a vulnerable woman \u2014 raise this to ten years-to-life meaning the remainder of natural life (Section 64(2)). Where the victim is under sixteen or twelve, or dies, or the rape is a gang rape, punishment escalates further, up to the death penalty (Sections 65, 66, 70).",explanations:["'Vagina' includes the labia majora.","Consent means an unequivocal voluntary agreement, communicated by words, gestures, or any verbal or non-verbal form, showing willingness to participate in the specific act \u2014 a woman who does not physically resist is not, for that reason alone, deemed to consent."],provisos:["Exception 1 \u2014 A medical procedure or intervention does not constitute rape.","Exception 2 \u2014 Sexual intercourse or acts by a man with his own wife, provided she is not under eighteen, is not rape."],ingredients:["One of the four acts described in clauses (a)-(d) is done","It occurs under one of the seven listed circumstances (absence of will/consent, coerced or vitiated consent, minority, or inability to communicate consent)"],illustrations:[],crossRefs:[64],cases:[{name:"Independent Thought v. Union of India",cite:"(2017) 10 SCC 800",year:2017,ratio:"The Supreme Court read down the marital-rape exception, holding that sexual intercourse with a wife under eighteen is rape regardless of marriage \u2014 this ruling is why Exception 2 is worded 'not being under eighteen years of age' rather than the older, lower age threshold.",url:"https://indiankanoon.org/doc/87705010/"}]},{id:64,ipc:376,category:"T",title:"Punishment for rape",text:"(1) Rape, other than the aggravated cases in sub-section (2), is punishable with rigorous imprisonment of ten years to life, and fine. (2) Rape committed by a police officer or public servant on a woman in their custody; by armed forces personnel in an area of deployment; by jail/institution/hospital staff on an inmate or patient; by a relative, guardian, teacher, or person in a position of trust; during communal or sectarian violence; on a woman known to be pregnant, incapable of consenting, or suffering mental illness or physical disability; causing grievous harm or repeated rape on the same woman \u2014 is punishable with rigorous imprisonment of ten years to imprisonment for life meaning the remainder of natural life, and fine.",illustrations:[],crossRefs:[63]},{id:65,ipc:null,category:"T",title:"Punishment for rape in certain cases (victim under 16 or 12)",text:"(1) Rape on a woman under sixteen is punishable with rigorous imprisonment of twenty years to life (meaning the remainder of natural life), and fine. (2) Rape on a woman under twelve is punishable with rigorous imprisonment of twenty years to life (meaning the remainder of natural life), and fine, or with death.",provisos:["Any fine imposed must be just and reasonable to cover the victim's medical treatment and rehabilitation, and is payable to the victim."],illustrations:[],crossRefs:[64]},{id:66,ipc:"376A",category:"T",title:"Punishment for causing death or persistent vegetative state of the victim",text:"Whoever commits an offence under Section 64(1) or (2), and in the course of it inflicts an injury causing the woman's death or leaving her in a persistent vegetative state, is punishable with rigorous imprisonment of twenty years to life (meaning the remainder of natural life), or with death.",illustrations:[],crossRefs:[64]},{id:67,ipc:"376B",category:"T",title:"Sexual intercourse by husband upon his wife during separation",text:"Whoever has sexual intercourse with his own wife, who is living separately under a decree of separation or otherwise, without her consent, shall be punished with imprisonment of two to seven years, and fine.",illustrations:[],crossRefs:[]},{id:68,ipc:"376C",category:"T",title:"Sexual intercourse by a person in authority",text:"Whoever, being in a position of authority or a fiduciary relationship, a public servant, superintendent/manager of a place of custody or a women's/children's institution, or hospital management/staff, abuses that position to induce or seduce a woman in their custody or charge into sexual intercourse not amounting to rape, shall be punished with rigorous imprisonment of five to ten years, and fine.",illustrations:[],crossRefs:[]},{id:69,ipc:null,category:"T",title:"Sexual intercourse by employing deceitful means, etc.",text:"Whoever, by deceitful means or a false promise to marry made without intending to keep it, has sexual intercourse with a woman not amounting to rape, shall be punished with imprisonment up to ten years, and fine.",explanations:["'Deceitful means' includes a false promise of employment or promotion, inducement, or marrying after concealing one's identity."],illustrations:[],crossRefs:[]},{id:70,ipc:"376D",category:"T",title:"Gang rape",text:"(1) Where a woman is raped by one or more persons constituting a group acting in furtherance of a common intention, each such person is deemed to have committed rape and is punishable with rigorous imprisonment of twenty years to life (meaning the remainder of natural life), and fine. (2) Where the woman is under eighteen, each person is punishable with imprisonment for life (remainder of natural life), and fine, or with death.",provisos:["Any fine imposed must be just and reasonable to cover medical treatment and rehabilitation, and is payable to the victim."],illustrations:[],crossRefs:[63]},{id:71,ipc:null,category:"T",title:"Punishment for repeat offenders",text:"Whoever, having been previously convicted of an offence under Section 64, 65, 66, or 67, is subsequently convicted of an offence under any of those sections, shall be punished with imprisonment for life (meaning the remainder of natural life), or with death.",illustrations:[],crossRefs:[64,65,66,67]},{id:72,ipc:null,category:"T",title:"Disclosure of identity of victim of certain offences",text:"(1) Printing or publishing the name or anything that may reveal the identity of a victim of an offence under Sections 64\u201371 is punishable with imprisonment up to two years, and fine. (2) This does not apply to disclosure authorised in writing by the investigating police officer acting in good faith, by the victim, or (where the victim is deceased, a minor, or has a mental illness) by the next of kin \u2014 such authorisation from next of kin may only be given to the head of a recognised welfare institution.",illustrations:[],crossRefs:[]},{id:73,ipc:null,category:"T",title:"Printing or publishing matter relating to Court proceedings without permission",text:"Whoever prints or publishes any matter relating to a Court proceeding on an offence referred to in Section 72, without the Court's prior permission, shall be punished with imprisonment up to two years, and fine.",explanations:["Printing or publishing a judgment of the High Court or Supreme Court is not an offence under this section."],illustrations:[],crossRefs:[72]},{id:74,ipc:354,category:"U",title:"Assault or criminal force to woman with intent to outrage her modesty",text:"Whoever assaults or uses criminal force to any woman, intending to outrage her modesty or knowing it likely to do so, shall be punished with imprisonment of one to five years, and fine.",illustrations:[],crossRefs:[]},{id:75,ipc:null,category:"U",title:"Sexual harassment",text:"(1) A man commits sexual harassment if he: (i) makes unwelcome, explicit sexual physical contact or advances; (ii) demands or requests sexual favours; (iii) shows pornography against a woman's will; or (iv) makes sexually coloured remarks. (2) Acts (i)-(iii) are punishable with rigorous imprisonment up to three years, or fine, or both. (3) Act (iv) is punishable with imprisonment up to one year, or fine, or both.",illustrations:[],crossRefs:[]},{id:76,ipc:"354B",category:"U",title:"Assault or use of criminal force to woman with intent to disrobe",text:"Whoever assaults or uses criminal force to a woman, or abets such an act, intending to disrobe her or compel her to be naked, shall be punished with imprisonment of three to seven years, and fine.",illustrations:[],crossRefs:[]},{id:77,ipc:"354C",category:"U",title:"Voyeurism",text:"Whoever watches or captures the image of a woman engaged in a private act, in circumstances where she would expect not to be observed, or disseminates such an image, is punishable on first conviction with imprisonment of one to three years and fine, and on a second or subsequent conviction with imprisonment of three to seven years and fine.",explanations:["'Private act' includes being watched in a place reasonably expected to provide privacy where genitals, posterior, or breasts are exposed or covered only in underwear, using a lavatory, or doing a sexual act not ordinarily done in public.","Consenting to the image being captured is not consent to its dissemination \u2014 disseminating it without that separate consent is itself an offence under this section."],illustrations:[],crossRefs:[]},{id:78,ipc:"354D",category:"U",title:"Stalking",text:"(1) A man commits stalking if he follows a woman and repeatedly contacts or attempts to contact her to foster personal interaction despite her clear disinterest, or monitors her use of the internet, email, or electronic communication \u2014 unless he proves it was to prevent/detect crime under State authorisation, was required by law, or was reasonable and justified in the circumstances. (2) Punishable on first conviction with imprisonment up to three years and fine, and on a second or subsequent conviction with imprisonment up to five years and fine.",illustrations:[],crossRefs:[]},{id:79,ipc:509,category:"U",title:"Word, gesture or act intended to insult the modesty of a woman",text:"Whoever, intending to insult a woman's modesty, utters any word, makes any sound or gesture, or exhibits any object, intending it to be heard or seen by her, or intrudes upon her privacy, shall be punished with simple imprisonment up to three years, and fine.",illustrations:[],crossRefs:[]},{id:80,ipc:"304B",category:"V2",title:"Dowry death",text:"(1) Where a woman dies of burns, bodily injury, or otherwise than under normal circumstances within seven years of marriage, and it is shown that she was subjected to cruelty or harassment by her husband or his relatives for or in connection with a dowry demand soon before her death, that death is called 'dowry death', and the husband or relative is deemed to have caused it. (2) Punishable with imprisonment of seven years to life.",explanations:["'Dowry' carries the same meaning as under Section 2 of the Dowry Prohibition Act, 1961."],ingredients:["Death of a woman by burns, injury, or unnatural circumstances","Within seven years of her marriage","Shown that she was subjected to cruelty/harassment for a dowry demand soon before death"],illustrations:[],crossRefs:[86]},{id:81,ipc:493,category:"V2",title:"Cohabitation caused by a man deceitfully inducing a belief of lawful marriage",text:"Whoever, by deceit, causes a woman not lawfully married to him to believe she is lawfully married, and to cohabit or have intercourse with him in that belief, shall be punished with imprisonment up to ten years, and fine.",illustrations:[],crossRefs:[]},{id:82,ipc:494,category:"V2",title:"Marrying again during lifetime of husband or wife (bigamy)",text:"(1) Whoever, having a spouse living, marries again in a case where such marriage is void by reason of taking place during that spouse's lifetime, shall be punished with imprisonment up to seven years, and fine. (2) If the subsequent marriage was contracted while concealing the former marriage from the other party, imprisonment up to ten years, and fine.",provisos:["Does not apply where the earlier marriage was declared void by a competent Court, or where the absent spouse has not been heard of as alive for seven continuous years and the other party is informed of the real facts before the subsequent marriage."],illustrations:[],crossRefs:[]},{id:83,ipc:496,category:"V2",title:"Marriage ceremony fraudulently gone through without lawful marriage",text:"Whoever, dishonestly or fraudulently, goes through a marriage ceremony knowing he is not thereby lawfully married, shall be punished with imprisonment up to seven years, and fine.",illustrations:[],crossRefs:[]},{id:84,ipc:498,category:"V2",title:"Enticing or taking away or detaining with criminal intent a married woman",text:"Whoever takes or entices away a woman known or believed to be another man's wife, intending that she have illicit intercourse with any person, or conceals or detains her with that intent, shall be punished with imprisonment up to two years, or fine, or both.",illustrations:[],crossRefs:[]},{id:85,ipc:"498A",category:"V2",title:"Husband or relative of husband subjecting a woman to cruelty",text:"Whoever, being the husband or a relative of the husband, subjects a woman to cruelty (as defined in Section 86), shall be punished with imprisonment up to three years, and fine.",illustrations:[],crossRefs:[86],cases:[{name:"Arnesh Kumar v. State of Bihar",cite:"(2014) 8 SCC 273",year:2014,ratio:"Responding to widespread misuse of this provision for arbitrary arrests, the Supreme Court held that arrest should not be automatic or routine, and directed police to first satisfy the necessity-of-arrest conditions under Section 35 BNSS (formerly Section 41 CrPC) before arresting \u2014 non-compliance invites departmental action and contempt proceedings against the police officer.",url:"https://indiankanoon.org/doc/2982624/"}]},{id:86,ipc:"498A",category:"V2",title:"Cruelty defined",text:"For the purposes of Section 85, 'cruelty' means: (a) wilful conduct likely to drive the woman to suicide, or to cause grave injury or danger to her life, limb, or health (mental or physical); or (b) harassment intended to coerce her, or a person related to her, into meeting an unlawful demand for property or valuable security, or harassment on account of failure to meet such a demand.",illustrations:[],crossRefs:[85,80]},{id:87,ipc:366,category:"V2",title:"Kidnapping, abducting, or inducing a woman to compel her marriage, etc.",text:"Whoever kidnaps or abducts a woman intending (or knowing it likely) that she will be compelled to marry against her will, or forced/seduced into illicit intercourse, is punishable with imprisonment up to ten years, and fine \u2014 the same applies to inducing a woman to leave any place, by criminal intimidation, abuse of authority, or other compulsion, with the same intent.",illustrations:[],crossRefs:[]},{id:88,ipc:312,category:"W",title:"Causing miscarriage",text:"Whoever voluntarily causes a pregnant woman to miscarry, unless done in good faith to save her life, shall be punished with imprisonment up to three years, or fine, or both; if the woman is quick with child, imprisonment up to seven years, and fine.",explanations:["A woman who causes her own miscarriage falls within the meaning of this section."],illustrations:[],crossRefs:[89]},{id:89,ipc:313,category:"W",title:"Causing miscarriage without the woman's consent",text:"Whoever causes a miscarriage without the woman's consent (whether or not she is quick with child) shall be punished with imprisonment for life, or imprisonment up to ten years, and fine.",illustrations:[],crossRefs:[88]},{id:90,ipc:314,category:"W",title:"Death caused by an act done with intent to cause miscarriage",text:"(1) Whoever, intending to cause a woman's miscarriage, does an act causing her death, shall be punished with imprisonment up to ten years, and fine. (2) If done without her consent, imprisonment for life, or the punishment in sub-section (1).",explanations:["It is not essential that the offender knew the act was likely to cause death."],illustrations:[],crossRefs:[]},{id:91,ipc:315,category:"W",title:"Act done with intent to prevent a child being born alive or to cause it to die after birth",text:"Whoever, before a child's birth, does an act intending to prevent it being born alive or to cause its death after birth, and thereby does so, shall (unless done in good faith to save the mother's life) be punished with imprisonment up to ten years, or fine, or both.",illustrations:[],crossRefs:[]},{id:92,ipc:316,category:"W",title:"Causing death of a quick unborn child by an act amounting to culpable homicide",text:"Whoever does an act that, had it caused a person's death, would amount to culpable homicide, and thereby causes the death of a quick unborn child, shall be punished with imprisonment up to ten years, and fine.",illustrations:["A, knowing he is likely to cause the death of a pregnant woman, does an act that would amount to culpable homicide if it killed her. She is injured but survives; the unborn quick child she carries dies as a result. A is guilty of the offence defined in this section."],crossRefs:[100]},{id:93,ipc:317,category:"X",title:"Exposure and abandonment of a child under twelve, by parent or caregiver",text:"Whoever, being the father, mother, or caregiver of a child under twelve, exposes or leaves the child anywhere intending to wholly abandon them, shall be punished with imprisonment up to seven years, or fine, or both.",explanations:["This does not bar trial for murder or culpable homicide if the child dies as a result of the exposure."],illustrations:[],crossRefs:[]},{id:94,ipc:318,category:"X",title:"Concealment of birth by secret disposal of a dead body",text:"Whoever, by secretly burying or otherwise disposing of a child's dead body (whether the child died before, during, or after birth), intentionally conceals or attempts to conceal the birth, shall be punished with imprisonment up to two years, or fine, or both.",illustrations:[],crossRefs:[]},{id:95,ipc:null,category:"X",title:"Hiring, employing or engaging a child to commit an offence",text:"Whoever hires, employs, or engages a child to commit an offence shall be punished with imprisonment of three to ten years, and fine; if the offence is actually committed, the person is additionally liable to the punishment for that offence as if they had committed it themselves.",explanations:["Hiring, employing, or using a child for sexual exploitation or pornography falls within this section."],illustrations:[],crossRefs:[]},{id:96,ipc:"366A",category:"X",title:"Procuration of a child",text:"Whoever, by any means, induces a child under eighteen to go from any place or to do any act, intending (or knowing it likely) that the child will be forced or seduced into illicit intercourse with another person, is punishable with imprisonment up to ten years, and fine.",illustrations:[],crossRefs:[]},{id:97,ipc:369,category:"X",title:"Kidnapping or abducting a child under ten to steal from its person",text:"Whoever kidnaps or abducts a child under ten, intending to dishonestly take movable property from the child's person, shall be punished with imprisonment up to seven years, and fine.",illustrations:[],crossRefs:[]},{id:98,ipc:372,category:"X",title:"Selling a child for purposes of prostitution, etc.",text:"Whoever sells, lets to hire, or otherwise disposes of a child under eighteen, intending (or knowing it likely) that the child will at any age be used for prostitution, illicit intercourse, or any unlawful or immoral purpose, shall be punished with imprisonment up to ten years, and fine.",explanations:["Where a female under eighteen is sold or let to hire to a prostitute or brothel-keeper, the seller is presumed (until proven otherwise) to have done so with intent that she be used for prostitution.","'Illicit intercourse' means sexual intercourse between persons not united by marriage or an equivalent recognised tie."],illustrations:[],crossRefs:[99]},{id:99,ipc:373,category:"X",title:"Buying a child for purposes of prostitution, etc.",text:"Whoever buys, hires, or otherwise obtains possession of a child under eighteen, intending (or knowing it likely) that the child will at any age be used for prostitution, illicit intercourse, or any unlawful or immoral purpose, shall be punished with imprisonment of seven to fourteen years, and fine.",explanations:["A prostitute or brothel-keeper who buys or obtains possession of a female under eighteen is presumed (until proven otherwise) to have done so with intent that she be used for prostitution."],illustrations:[],crossRefs:[98]},{id:100,ipc:299,category:"M",title:"Culpable homicide",text:"Whoever causes death by doing an act with the intention of causing death, or with the intention of causing such bodily injury as is likely to cause death, or with the knowledge that he is likely by such act to cause death, commits the offence of culpable homicide.",simpleExplanation:"Culpable homicide is the broad category \u2014 'unlawful killing.' Murder (Section 101) is a narrower, more serious subset within it. Think of it as two circles: every murder is culpable homicide, but not every culpable homicide is murder. What separates the two is the degree of intention/knowledge and whether an Exception applies \u2014 this is exactly the distinction Reg. v. Govinda first drew.",punishment:"Culpable homicide itself has no fixed punishment \u2014 its punishment depends on whether it turns out to be murder (Section 103: death or life imprisonment) or culpable homicide not amounting to murder (Section 105: life imprisonment, or 5\u201310 years with fine, or up to 10 years with fine, depending on intention vs. mere knowledge).",explanations:["A person who causes bodily injury to another who is labouring under a disorder, disease or bodily infirmity, and thereby accelerates that other's death, shall be deemed to have caused his death."],ingredients:["Death of a person was caused by the accused's act","The act was done with intention of causing death, OR intention of causing bodily injury likely to cause death, OR knowledge that the act was likely to cause death"],illustrations:["A lays sticks and turf over a pit, intending or knowing it likely to cause death. Z, believing the ground firm, treads on it, falls in and is killed. A has committed culpable homicide.","A, by shooting at a fowl with intent to kill and steal it, kills B, who is behind a bush, not knowing B was there. A is not guilty of culpable homicide, as he neither intended B's death nor knew the act was likely to cause it."],crossRefs:[101],cases:[{name:"Reg. v. Govinda",cite:"(1876) ILR 1 Bom 342",year:1876,ratio:"This foundational Bombay High Court ruling (Melvill J.) first drew the line between culpable homicide and murder: culpable homicide is the genus, murder the aggravated species. Where injury is likely but not sufficient in the ordinary course of nature to cause death, and death was not intended, the offence remains culpable homicide, not murder.",url:"https://indiankanoon.org/doc/783074/"}]},{id:101,ipc:300,category:"M",title:"Murder",text:"Except in the cases hereinafter excepted, culpable homicide is murder \u2014 (a) if the act is done with the intention of causing death; or (b) if done with the intention of causing such bodily injury as the offender knows to be likely to cause death; or (c) if done with the intention of causing bodily injury to any person, and the bodily injury intended to be inflicted is sufficient in the ordinary course of nature to cause death; or (d) if the person committing the act knows it to be so imminently dangerous that it must, in all probability, cause death or such injury as is likely to cause death, and commits the act without any excuse for incurring that risk.",simpleExplanation:"Murder is the most serious form of culpable homicide (Section 100). Not every killing is murder \u2014 it becomes murder when the killer either meant to kill, meant to cause an injury they knew was likely fatal, meant to cause an injury that turns out to be objectively fatal (clause (c) \u2014 this is what Virsa Singh interprets), or did something so recklessly dangerous that death was almost certain. Even then, it's NOT murder if one of the five Exceptions applies (e.g. sudden grave provocation) \u2014 those turn it back into the lesser offence of culpable homicide not amounting to murder (Section 105).",punishment:"Death or imprisonment for life, plus fine (Section 103). Where five or more people act together and kill on grounds like caste, religion, or race, each member faces death, life imprisonment, or a minimum of seven years, plus fine.",ingredients:["Culpable homicide (Section 100) is first established","Falls under clause (a), (b), (c), or (d) above","None of the five Exceptions apply"],illustrations:["A shoots Z with the intention of killing him. Z dies in consequence. A commits murder.","A intentionally gives Z a sword-cut sufficient to cause death in the ordinary course of nature. Z dies. A is guilty of murder, although he may not have intended Z's death specifically.","A, without excuse, fires a loaded cannon into a crowd and kills one person. A is guilty of murder, though he had no premeditated design against that particular individual."],provisos:["Exception 1 \u2014 Grave and sudden provocation: not murder if the offender, deprived of self-control by grave and sudden provocation, kills the provoker (or another, by mistake/accident) \u2014 unless the provocation was self-sought, given by a lawful act of a public servant, or given in the lawful exercise of private defence.","Exception 2 \u2014 Exceeding the right of private defence: not murder if done in good-faith exercise of private defence, exceeding the power given by law, without premeditation and without intending more harm than necessary.","Exception 3 \u2014 Public servant exceeding lawful powers: not murder if a public servant (or one aiding him) acting for the advancement of public justice exceeds his lawful powers and causes death by an act believed in good faith to be lawful and necessary, without ill-will.","Exception 4 \u20
