14 Sudden fight: not murder if committed without premeditation in a sudden fight, in the heat of passion, without undue advantage or cruelty.","Exception 5 \u2014 Consent: not murder if the person killed, above eighteen, suffers death or takes the risk of death with his own consent."],crossRefs:[100],cases:[{name:"Virsa Singh v. State of Punjab",cite:"AIR 1958 SC 465",year:1958,ratio:"The Supreme Court laid down a four-part test for clause (c): the injury must be objectively present, its nature proved, its infliction shown to be intentional (not accidental), and it must be objectively sufficient in the ordinary course of nature to cause death \u2014 the offender's awareness that it was fatal is irrelevant once these are proved.",url:"https://indiankanoon.org/doc/1296255/"},{name:"K.M. Nanavati v. State of Maharashtra",cite:"AIR 1962 SC 605",year:1961,ratio:"The Supreme Court held that Exception 1 (grave and sudden provocation) only protects a killing done while the offender's passion was still hot \u2014 if enough time passed for the mind to 'cool down' before the fatal act, the exception does not apply, and the offence remains murder.",url:"https://indiankanoon.org/doc/1596139/"}]},{id:102,ipc:301,category:"M",title:"Culpable homicide by causing death of person other than person whose death was intended",text:"If a person, doing an act intending or knowing it likely to cause death, commits culpable homicide by causing the death of a person whose death he neither intended nor knew himself likely to cause, the culpable homicide committed is of the same description as it would have been had he caused the death of the person he actually intended or knew himself likely to kill.",illustrations:[],crossRefs:[100,101]},{id:103,ipc:302,category:"M",title:"Punishment for murder",text:"(1) Whoever commits murder shall be punished with death or imprisonment for life, and shall also be liable to fine. (2) When a group of five or more persons acting in concert commits murder on the ground of race, caste, community, sex, place of birth, language, personal belief, or any other similar ground, each member of the group shall be punished with death, imprisonment for life, or imprisonment for a term not less than seven years, and shall also be liable to fine.",illustrations:[],crossRefs:[101]},{id:104,ipc:303,category:"M",title:"Punishment for murder by life-convict",text:"Whoever, being under sentence of imprisonment for life, commits murder, shall be punished with death or with imprisonment for life, meaning the remainder of that person's natural life.",illustrations:[],crossRefs:[101]},{id:105,ipc:304,category:"M",title:"Punishment for culpable homicide not amounting to murder",text:"Whoever commits culpable homicide not amounting to murder shall be punished with imprisonment for life, or imprisonment for a term of five to ten years, and fine, if the act was done with intention of causing death or of causing bodily injury likely to cause death; or with imprisonment up to ten years and fine, if done with knowledge that it was likely to cause death, but without any such intention.",illustrations:[],crossRefs:[100,101]},{id:106,ipc:null,category:"N",title:"Causing death by negligence",text:"(1) Whoever causes the death of any person by a rash or negligent act not amounting to culpable homicide shall be punished with imprisonment up to five years and fine; if such an act is done by a registered medical practitioner performing a medical procedure, imprisonment up to two years and fine. (2) Whoever causes death by rash or negligent driving of a vehicle, not amounting to culpable homicide, and escapes without reporting it to a police officer or Magistrate soon after, shall be punished with imprisonment up to ten years and fine.",illustrations:[],crossRefs:[]},{id:107,ipc:305,category:"N",title:"Abetment of suicide of child or person of unsound mind",text:"If any person under eighteen, any person with mental illness, any delirious person, or any intoxicated person commits suicide, whoever abets that suicide shall be punished with death, imprisonment for life, or imprisonment up to ten years, and shall also be liable to fine.",illustrations:[],crossRefs:[]},{id:108,ipc:306,category:"N",title:"Abetment of suicide",text:"If any person commits suicide, whoever abets the commission of such suicide shall be punished with imprisonment up to ten years, and shall also be liable to fine.",illustrations:[],crossRefs:[]},{id:109,ipc:307,category:"N",title:"Attempt to murder",text:"(1) Whoever does any act with such intention or knowledge, and under such circumstances that, had death been caused, he would be guilty of murder, shall be punished with imprisonment up to ten years and fine; if hurt is caused by such act, he shall be liable to imprisonment for life or the punishment above. (2) If the offender under sub-section (1) is already under sentence of imprisonment for life, and hurt is caused, he may be punished with death or imprisonment for life meaning the remainder of his natural life.",ingredients:["An act done with the intention or knowledge that would make the offender guilty of murder if death resulted","Circumstances such that death could have resulted from the act","Death did not actually occur"],illustrations:["A shoots at Z intending to kill him, under such circumstances that had death ensued, A would be guilty of murder. A is liable under this section, whether or not Z is actually hit.","A, intending to murder Z by poison, purchases poison, mixes it with food, and delivers it to Z's servant to be placed on Z's table. A has committed the offence defined in this section, even before Z eats the food."],crossRefs:[101]},{id:110,ipc:308,category:"N",title:"Attempt to commit culpable homicide",text:"Whoever does any act with such intention or knowledge, and under such circumstances that, had death been caused, he would be guilty of culpable homicide not amounting to murder, shall be punished with imprisonment up to three years, or fine, or both; if hurt is caused by such act, imprisonment up to seven years, or fine, or both.",illustrations:["A, on grave and sudden provocation, fires a pistol at Z, under such circumstances that if death were caused, A would be guilty only of culpable homicide not amounting to murder. A has committed the offence defined in this section."],crossRefs:[105]},{id:111,ipc:null,category:"O",title:"Organised crime",text:"(1) Any continuing unlawful activity \u2014 including kidnapping, robbery, vehicle theft, extortion, land grabbing, contract killing, economic offences, cyber-crime, or trafficking of persons, drugs, weapons or illicit goods or services, or human trafficking for prostitution or ransom \u2014 carried out by a person or group acting in concert, singly or jointly, either as a member of an organised crime syndicate or on its behalf, by violence, threat of violence, intimidation, coercion, or any other unlawful means, to obtain direct or indirect material benefit (including financial benefit), constitutes organised crime.",explanations:["To sub-section (1)(i): 'Organised crime syndicate' means a group of two or more persons who, acting singly or jointly, as a syndicate or gang, indulge in continuing unlawful activity.","To sub-section (1)(ii): 'Continuing unlawful activity' means an activity prohibited by law, being a cognizable offence punishable with three or more years' imprisonment, undertaken singly or jointly as a member of, or on behalf of, an organised crime syndicate, in respect of which more than one chargesheet has been filed before a competent Court within the preceding ten years, and that Court has taken cognizance \u2014 this includes economic offences.","To sub-section (1)(iii): 'Economic offences' include criminal breach of trust, forgery, counterfeiting of currency-notes/bank-notes/Government stamps, hawala transactions, and mass-marketing fraud or schemes to defraud several persons, banks, or financial institutions.","To the section as a whole: 'Proceeds of any organised crime' means all kinds of property derived or obtained from, or acquired through funds traceable to, any organised crime \u2014 including cash, regardless of in whose name or possession it is found."],illustrations:[],provisos:["(2)(a) \u2014 If the organised crime results in death: punishable with death or imprisonment for life, and fine not less than ten lakh rupees.","(2)(b) \u2014 In any other case: imprisonment of five years to life, and fine not less than five lakh rupees.","(3) \u2014 Abetting, attempting, conspiring, or knowingly facilitating organised crime, or engaging in any preparatory act: imprisonment of five years to life, and fine not less than five lakh rupees.","(4) \u2014 Being a member of an organised crime syndicate: imprisonment of five years to life, and fine not less than five lakh rupees.","(5) \u2014 Intentionally harbouring or concealing a person who has committed organised crime: imprisonment of three years to life, and fine not less than five lakh rupees \u2014 provided this does not apply where the harbourer/concealer is the offender's spouse.","(6) \u2014 Possessing property derived or obtained from organised crime: imprisonment of three years to life, and fine not less than two lakh rupees.","(7) \u2014 Possessing, on behalf of a syndicate member, movable or immovable property that cannot be satisfactorily accounted for: imprisonment of three to ten years, and fine not less than one lakh rupees."],crossRefs:[]},{id:112,ipc:null,category:"O",title:"Petty organised crime",text:"(1) Crimes causing general public insecurity \u2014 vehicle theft or theft from vehicles, domestic and business theft, trick theft, cargo crime, theft (including attempts), organised pickpocketing, snatching, shoplifting, card-skimming and ATM theft, illegal ticket sales, or selling public examination question papers, and similar organised crimes \u2014 including when committed by mobile groups building networks of contacts and logistics across a region before moving on \u2014 constitute petty organised crime. (2) Punishable with imprisonment of one to seven years, and fine.",illustrations:[],crossRefs:[]},{id:113,ipc:null,category:"O",title:"Terrorist act",text:"(1) A person commits a terrorist act if he does any act in India or a foreign country, with intent to threaten India's unity, integrity, or security, to intimidate the public, or to disturb public order, by \u2014 (a) using bombs, explosives, firearms, poison, noxious gases, chemicals, or hazardous biological substances to spread fear, cause death or serious harm, or endanger life; (b) causing damage or destruction to property, or disrupting essential supplies or services, or destroying a Government/public facility or private property; (c) causing extensive interference with or damage to critical infrastructure; (d) provoking or compelling the Government (or intimidating/detaining a person) to act or abstain from acting, or seeking to destabilise the political, economic or social structure of the country, or create a public emergency; or (e) an act within the scope of the treaties listed in the Second Schedule to the Unlawful Activities (Prevention) Act, 1967.",explanations:["'Terrorist' (for this section) refers to a person who develops, manufactures, possesses, transports, supplies, or uses weapons/explosives/hazardous substances or causes fire, floods, or explosions for a terrorist act; or commits, attempts, or conspires to commit a terrorist act, directly or indirectly; or participates as principal or accomplice in a terrorist act.","'Proceeds of terrorism' carries the same meaning as under Section 2(g) of the Unlawful Activities (Prevention) Act, 1967.","'Terrorist organisation, association or group' refers to any entity owned or controlled by a terrorist or group of terrorists that commits, attempts, participates in, prepares for, promotes, organises, directs, contributes to, or is otherwise involved in terrorism \u2014 including any organisation listed in the First Schedule to the UAPA, 1967, or operating under the same name as one so listed."],illustrations:[],provisos:["(2)(a) \u2014 If the terrorist act results in death: punishable with death or imprisonment for life without parole, and fine not less than ten lakh rupees.","(2)(b) \u2014 In any other case: imprisonment of five years to life, and fine not less than five lakh rupees.","(3) \u2014 Conspiring, organising, or causing to be organised any group for terrorist acts, or assisting/facilitating preparatory acts: imprisonment of five years to life, and fine not less than five lakh rupees.","(4) \u2014 Being a member of a terrorist organisation involved in a terrorist act: imprisonment up to life, and fine not less than five lakh rupees.","(5) \u2014 Intentionally harbouring, concealing, or attempting to harbour/conceal a person who has committed a terrorist act: imprisonment of three years to life, and fine not less than five lakh rupees \u2014 provided this does not apply where the harbourer/concealer is the offender's spouse.","(6) \u2014 Holding, possessing, providing, collecting, or using property, funds, or financial services derived from or intended to facilitate a terrorist act: imprisonment up to life, and fine not less than five lakh rupees; such property is also liable to attachment and forfeiture."],crossRefs:[]},{id:114,ipc:319,category:"P",title:"Hurt",text:"Whoever causes bodily pain, disease, or infirmity to any person is said to cause hurt.",illustrations:[],crossRefs:[]},{id:115,ipc:321,category:"P",title:"Voluntarily causing hurt",text:"(1) Whoever does an act with the intention of causing hurt, or with knowledge that he is likely to cause hurt, and does thereby cause hurt, is said to voluntarily cause hurt. (2) Whoever, except as provided in Section 120(1), voluntarily causes hurt, shall be punished with imprisonment up to one year, or fine up to ten thousand rupees, or both.",ingredients:["An act done with intention to cause hurt, or knowledge it is likely to cause hurt","Hurt is actually caused as a result"],illustrations:[],crossRefs:[120]},{id:116,ipc:320,category:"P",title:"Grievous hurt",text:"The following kinds of hurt only are designated 'grievous': (1) Emasculation. (2) Permanent privation of sight of either eye. (3) Permanent privation of hearing of either ear. (4) Privation of any member or joint. (5) Destruction or permanent impairing of the powers of any member or joint. (6) Permanent disfiguration of the head or face. (7) Fracture or dislocation of a bone or tooth. (8) Any hurt endangering life, or causing the sufferer severe bodily pain, or inability to follow ordinary pursuits, for fifteen days or more.",ingredients:["The hurt must fall within one of the eight specifically listed categories \u2014 this is an exhaustive list, not illustrative"],illustrations:[],crossRefs:[117]},{id:117,ipc:322,category:"P",title:"Voluntarily causing grievous hurt",text:"(1) Whoever voluntarily causes hurt is said to voluntarily cause grievous hurt if the hurt he intends or knows himself likely to cause, and the hurt he actually causes, is grievous hurt. (2) Punishable, except as provided in sub-section (3), with imprisonment up to seven years and fine. (3) If the offence causes permanent disability or a persistent vegetative state, punishable with rigorous imprisonment of ten years to life. (4) If grievous hurt is caused by a group of five or more on grounds of race, caste, sex, place of birth, language, personal belief, or similar ground, each member is punishable with imprisonment up to seven years and fine.",explanations:["A person is not said to voluntarily cause grievous hurt unless he both causes it and intends or knows himself likely to cause it \u2014 but if he intends one kind of grievous hurt and actually causes another kind, he is still said to have voluntarily caused grievous hurt."],illustrations:["A, intending to permanently disfigure Z's face, gives a blow that does not disfigure Z but causes severe pain for fifteen days. A has voluntarily caused grievous hurt (of a different kind than intended)."],ingredients:["Voluntarily causing hurt (Section 115)","The hurt intended/known-likely, and the hurt actually caused, both qualify as 'grievous' under Section 116"],crossRefs:[115,116]},{id:118,ipc:324,category:"P",title:"Voluntarily causing hurt or grievous hurt by dangerous weapons or means",text:"Voluntarily causing hurt by a shooting, stabbing, or cutting instrument, or any weapon likely to cause death, or by fire, heated substance, poison, corrosive substance, explosive, a substance deleterious to inhale/swallow/absorb into blood, or by an animal \u2014 punishable, for hurt, with imprisonment up to three years or fine up to twenty thousand rupees, or both; for grievous hurt by the same means, imprisonment for life or one to ten years, and fine.",illustrations:[],crossRefs:[]},{id:119,ipc:327,category:"P",title:"Voluntarily causing hurt or grievous hurt to extort property, or to constrain to an illegal act",text:"Voluntarily causing hurt to extort property or valuable security, or to constrain the sufferer (or someone interested in them) to do an illegal act, is punishable with imprisonment up to ten years and fine; for grievous hurt with the same purpose, imprisonment for life or up to ten years, and fine.",illustrations:[],crossRefs:[]},{id:120,ipc:330,category:"P",title:"Voluntarily causing hurt or grievous hurt to extort confession, or to compel restoration of property",text:"(1) Voluntarily causing hurt to extort a confession or information leading to detection of an offence, or to compel restoration of property \u2014 punishable with imprisonment up to seven years and fine. (2) For grievous hurt with the same purpose, imprisonment up to ten years and fine.",illustrations:["A, a police officer, tortures Z to induce a confession. A is guilty under this section.","A, a revenue officer, tortures Z to compel payment of arrears due. A is guilty under this section."],crossRefs:[115,117]},{id:121,ipc:332,category:"P",title:"Voluntarily causing hurt or grievous hurt to deter public servant from his duty",text:"(1) Voluntarily causing hurt to a public servant in the discharge of his duty, or to deter/prevent such discharge, or in consequence of it \u2014 imprisonment up to five years, or fine, or both. (2) For grievous hurt in the same circumstances \u2014 imprisonment of one to ten years, and fine.",illustrations:[],crossRefs:[]},{id:122,ipc:335,category:"P",title:"Voluntarily causing hurt or grievous hurt on provocation",text:"(1) Voluntarily causing hurt on grave and sudden provocation, without intending or knowing it likely to harm anyone other than the provoker \u2014 imprisonment up to one month, or fine up to five thousand rupees, or both. (2) For grievous hurt in the same circumstances \u2014 imprisonment up to five years, or fine up to ten thousand rupees, or both.",explanations:["Subject to the same provisos as Exception 1 to Section 101 (the provocation must not be self-sought, given by lawful action of a public servant, or given during lawful private defence)."],illustrations:[],crossRefs:[101]},{id:123,ipc:328,category:"P",title:"Causing hurt by means of poison, etc., with intent to commit an offence",text:"Administering, or causing to be taken, any poison or stupefying, intoxicating, or unwholesome drug or substance, with intent to cause hurt, or to commit or facilitate an offence, or knowing hurt is likely to be caused thereby \u2014 punishable with imprisonment up to ten years and fine.",illustrations:[],crossRefs:[]},{id:124,ipc:326,category:"P",title:"Voluntarily causing grievous hurt by use of acid, etc.",text:"(1) Causing permanent or partial damage, deformity, burns, maiming, disfigurement, disability, or a permanent vegetative state by throwing or administering acid, or by any comparable means, with intent or knowledge \u2014 punishable with rigorous imprisonment of ten years to life, and a fine that must be just and reasonable to cover the victim's medical treatment, payable to the victim. (2) Throwing or attempting to throw/administer acid, or attempting comparable means, with such intent \u2014 punishable with imprisonment of five to seven years, and fine.",explanations:["'Acid' includes any substance with acidic or corrosive character or burning nature capable of causing bodily injury leading to scarring or disfigurement, temporary or permanent."],illustrations:[],crossRefs:[]},{id:125,ipc:336,category:"P",title:"Act endangering life or personal safety of others",text:"Doing any act so rashly or negligently as to endanger human life or personal safety \u2014 punishable with imprisonment up to three months or fine up to two thousand five hundred rupees, or both; if hurt is caused, imprisonment up to six months or fine up to five thousand rupees, or both; if grievous hurt is caused, imprisonment up to three years or fine up to ten thousand rupees, or both.",illustrations:[],crossRefs:[]},{id:126,ipc:339,category:"Q",title:"Wrongful restraint",text:"(1) Whoever voluntarily obstructs a person so as to prevent that person proceeding in a direction they have a right to proceed in, is said to wrongfully restrain them. (2) Punishable with simple imprisonment up to one month, or fine up to five thousand rupees, or both.",provisos:["The obstruction of a private way over land or water, which a person in good faith believes he has a lawful right to obstruct, is not an offence under this section."],illustrations:["A obstructs a path along which Z has a right to pass, not believing in good faith that he has a right to stop it. Z is thereby prevented from passing. A wrongfully restrains Z."],crossRefs:[127]},{id:127,ipc:340,category:"Q",title:"Wrongful confinement",text:"(1) Wrongfully restraining a person so as to prevent them proceeding beyond certain circumscribing limits is 'wrongful confinement'. (2) Basic punishment: imprisonment up to one year, or fine up to five thousand rupees, or both. (3) For three days or more: imprisonment up to three years, or fine up to ten thousand rupees, or both. (4) For ten days or more: imprisonment up to five years, and fine not less than ten thousand rupees. (5)-(8) Enhanced punishments apply for confining someone despite a writ of liberation, confining someone secretly so their whereabouts are unknown, or confining someone to extort property, a confession, or information.",illustrations:["A causes Z to enter a walled space and locks him in, preventing him proceeding beyond the wall. A wrongfully confines Z.","A places armed men at a building's exits and tells Z they will fire if he tries to leave. A wrongfully confines Z."],crossRefs:[126]},{id:128,ipc:349,category:"R",title:"Force",text:"A person uses force on another if he causes motion, change of motion, or cessation of motion to that other (or to a substance that brings it into contact with that other), by his own bodily power, by disposing a substance so that motion happens without further act, or by inducing an animal to move.",illustrations:[],crossRefs:[129]},{id:129,ipc:350,category:"R",title:"Criminal force",text:"Whoever intentionally uses force to any person, without that person's consent, in order to commit an offence, or intending or knowing it likely that such force will cause injury, fear, or annoyance to the person to whom it is used, is said to use criminal force.",illustrations:["A intentionally pushes against Z in the street, without Z's consent, intending or knowing it likely to injure, frighten, or annoy Z. A has used criminal force to Z.","A pours boiling water into a bath he knows Z is about to use, without Z's consent, intending or knowing it likely to injure or annoy Z. A has used criminal force to Z."],crossRefs:[128,130]},{id:130,ipc:351,category:"R",title:"Assault",text:"Whoever makes any gesture, or preparation, intending or knowing it likely that it will cause any person present to apprehend that criminal force is about to be used against them, is said to commit an assault.",explanations:["Mere words do not amount to an assault. But words may give a gesture or preparation a meaning that makes it amount to an assault."],ingredients:["A gesture or preparation is made","It is intended, or known to be likely, to cause apprehension of imminent criminal force in a person present"],illustrations:["A shakes his fist at Z, intending or knowing it likely to make Z believe A is about to strike him. A has committed an assault.","A takes up a stick, saying to Z, 'I will give you a beating.' The words alone would not be an assault, but the gesture explained by the words may amount to one."],crossRefs:[129]},{id:131,ipc:352,category:"R",title:"Punishment for assault or criminal force otherwise than on grave provocation",text:"Whoever assaults or uses criminal force to any person, otherwise than on grave and sudden provocation given by that person, shall be punished with imprisonment up to three months, or fine up to one thousand rupees, or both.",explanations:["Provocation does not mitigate punishment under this section if self-sought, given by a lawful act of a public servant, or given during lawful private defence."],illustrations:[],crossRefs:[136]},{id:132,ipc:353,category:"R",title:"Assault or criminal force to deter public servant from discharge of his duty",text:"Whoever assaults or uses criminal force to a public servant in the execution of his duty, or to prevent/deter such discharge, or in consequence of it, shall be punished with imprisonment up to two years, or fine, or both.",illustrations:[],crossRefs:[]},{id:133,ipc:354,category:"R",title:"Assault or criminal force with intent to dishonour a person, otherwise than on grave provocation",text:"Whoever assaults or uses criminal force to any person, intending to dishonour them, otherwise than on grave and sudden provocation given by that person, shall be punished with imprisonment up to two years, or fine, or both.",illustrations:[],crossRefs:[]},{id:134,ipc:356,category:"R",title:"Assault or criminal force in attempt to commit theft of property carried by a person",text:"Whoever assaults or uses criminal force to any person while attempting to commit theft of property that person is wearing or carrying, shall be punished with imprisonment up to two years, or fine, or both.",illustrations:[],crossRefs:[]},{id:135,ipc:357,category:"R",title:"Assault or criminal force in attempt wrongfully to confine a person",text:"Whoever assaults or uses criminal force to any person while attempting to wrongfully confine them, shall be punished with imprisonment up to one year, or fine up to five thousand rupees, or both.",illustrations:[],crossRefs:[127]},{id:136,ipc:358,category:"R",title:"Assault or criminal force on grave provocation",text:"Whoever assaults or uses criminal force to any person on grave and sudden provocation given by that person, shall be punished with simple imprisonment up to one month, or fine up to one thousand rupees, or both.",explanations:["Subject to the same explanation as Section 129 \u2014 provocation is measured by whether it was grave and sudden enough, a question of fact."],illustrations:[],crossRefs:[131]},{id:137,ipc:359,category:"S",title:"Kidnapping",text:"Kidnapping is of two kinds: (a) kidnapping from India \u2014 conveying a person beyond India's limits without their consent (or that of someone legally authorised to consent for them); and (b) kidnapping from lawful guardianship \u2014 taking or enticing a child under eighteen, or a person with mental illness, out of the keeping of their lawful guardian, without the guardian's consent. Punishable with imprisonment up to seven years and fine.",provisos:["Does not extend to a person who, in good faith, believes himself to be the father of an illegitimate child under eighteen, or believes himself entitled to the child's lawful custody, unless the act is for an immoral or unlawful purpose."],ingredients:["Taking or enticing a minor (under 18) or person of unsound mind out of lawful guardianship, OR conveying a person beyond India's limits","Without the consent of the guardian, or the person / their authorised representative, respectively"],illustrations:[],crossRefs:[138]},{id:138,ipc:362,category:"S",title:"Abduction",text:"Whoever by force compels, or by any deceitful means induces, any person to go from any place, is said to abduct that person.",illustrations:[],crossRefs:[137]},{id:139,ipc:"363A",category:"S",title:"Kidnapping or maiming a child for purposes of begging",text:"(1) Kidnapping a child under eighteen, or obtaining custody of such a child (without being the lawful guardian), for the purpose of begging \u2014 rigorous imprisonment of ten years to life, and fine. (2) Maiming a child under eighteen for the purpose of begging \u2014 imprisonment of twenty years to life (meaning the remainder of natural life), and fine. (3) A non-guardian who employs or uses such a child for begging is presumed, unless proven otherwise, to have kidnapped or obtained the child for that purpose.",explanations:["'Begging' includes soliciting or receiving alms in public (however disguised), entering private premises to solicit alms, exhibiting a sore, wound, deformity, or disease to obtain alms, and using a child as an exhibit to solicit alms."],illustrations:[],crossRefs:[]},{id:140,ipc:364,category:"S",title:"Kidnapping or abducting in order to murder or for ransom, etc.",text:"(1) Kidnapping or abducting a person so that they may be murdered, or disposed of in a manner risking murder \u2014 imprisonment for life or up to ten years, and fine. (2) Kidnapping/abducting and threatening death or hurt, or by conduct raising reasonable apprehension of death or hurt, or actually causing hurt or death, to compel the Government, a foreign state, an international organisation, or any other person to act, abstain, or pay ransom \u2014 punishable with death or imprisonment for life, and fine. (3) Kidnapping/abducting with intent to secretly and wrongfully confine \u2014 imprisonment up to seven years, and fine. (4) Kidnapping/abducting to subject the person to grievous hurt, slavery, or unnatural lust \u2014 imprisonment up to ten years, and fine.",ingredients:["Kidnapping or abduction (as defined in Sections 137/138)","Done with intent (or knowledge of likelihood) that the person will be murdered, subjected to grievous harm, or used to extract ransom/compliance through threats to their safety"],illustrations:["A kidnaps Z from India, intending or knowing it likely that Z may be sacrificed to an idol. A has committed the offence defined in this section.","A forcibly carries B away from home in order that B may be murdered. A has committed the offence defined in this section."],crossRefs:[137,138]},{id:141,ipc:"366B",category:"S",title:"Importation of girl or boy from foreign country",text:"Importing into India, from any country outside it, a girl under twenty-one or a boy under eighteen, with intent (or knowledge it is likely) that they will be forced or seduced into illicit intercourse with another person \u2014 punishable with imprisonment up to ten years and fine.",illustrations:[],crossRefs:[]},{id:142,ipc:368,category:"S",title:"Wrongfully concealing or keeping in confinement, kidnapped or abducted person",text:"Whoever, knowing a person has been kidnapped or abducted, wrongfully conceals or confines them, shall be punished as if he himself had kidnapped or abducted that person with the same intention or for the same purpose.",illustrations:[],crossRefs:[137,138]},{id:143,ipc:370,category:"S",title:"Trafficking of person",text:"(1) Recruiting, transporting, harbouring, transferring, or receiving a person, for the purpose of exploitation, by means of threats, force or coercion, abduction, fraud or deception, abuse of power, or inducement (including payments or benefits) to obtain the consent of a person controlling the victim, constitutes trafficking. (2)-(7) Base punishment is rigorous imprisonment of seven to ten years, escalating to ten years-to-life for trafficking multiple persons or a child, fourteen years-to-life for multiple children, mandatory life imprisonment for repeat child-trafficking offenders, and mandatory life imprisonment where a public servant or police officer is involved.",explanations:["'Exploitation' includes physical or sexual exploitation, slavery or practices similar to slavery, servitude, beggary, or forced organ removal.","The consent of the victim is immaterial in determining whether trafficking occurred."],illustrations:[],crossRefs:[]},{id:144,ipc:370,category:"S",title:"Exploitation of a trafficked person",text:"(1) Knowingly, or with reason to believe, engaging a trafficked child (under eighteen) for sexual exploitation \u2014 rigorous imprisonment of five to ten years, and fine. (2) The same act against a trafficked adult \u2014 rigorous imprisonment of three to seven years, and fine.",illustrations:[],crossRefs:[143]},{id:145,ipc:371,category:"S",title:"Habitual dealing in slaves",text:"Whoever habitually imports, exports, removes, buys, sells, traffics, or deals in slaves shall be punished with imprisonment for life, or imprisonment up to ten years, and shall also be liable to fine.",illustrations:[],crossRefs:[]},{id:146,ipc:374,category:"S",title:"Unlawful compulsory labour",text:"Whoever unlawfully compels any person to labour against that person's will shall be punished with imprisonment up to one year, or fine, or both.",illustrations:[],crossRefs:[]},{id:147,ipc:121,category:"AA",title:"Waging, or attempting to wage war, or abetting waging of war, against the Government of India",text:"Whoever wages war against the Government of India, or attempts to wage such war, or abets the waging of such war, shall be punished with death, or imprisonment for life and shall also be liable to fine.",punishment:"Death, or imprisonment for life, plus fine.",illustrations:["A joins an insurrection against the Government of India. A has committed the offence defined in this section."],crossRefs:[]},{id:148,ipc:"121A",category:"AA",title:"Conspiracy to commit offences punishable by Section 147",text:"Whoever within or without and beyond India conspires to commit any of the offences punishable by section 147, or conspires to overawe, by means of criminal force or the show of criminal force, the Central Government or any State Government, shall be punished with imprisonment for life, or with imprisonment of either description which may extend to ten years, and shall also be liable to fine.",explanations:["To constitute a conspiracy under this section, it is not necessary that any act or illegal omission shall take place in pursuance thereof \u2014 the agreement alone is enough."],punishment:"Imprisonment for life, or up to ten years, plus fine.",illustrations:[],crossRefs:[147]},{id:149,ipc:122,category:"AA",title:"Collecting arms, etc., with intention of waging war against the Government of India",text:"Whoever collects men, arms or ammunition or otherwise prepares to wage war with the intention of either waging or being prepared to wage war against the Government of India, shall be punished with imprisonment for life or imprisonment of either description for a term not exceeding ten years, and shall also be liable to fine.",punishment:"Imprisonment for life, or up to ten years, plus fine.",illustrations:[],crossRefs:[147]},{id:150,ipc:123,category:"AA",title:"Concealing with intent to facilitate design to wage war",text:"Whoever by any act, or by any illegal omission, conceals the existence of a design to wage war against the Government of India, intending by such concealment to facilitate, or knowing it to be likely that such concealment will facilitate, the waging of such war, shall be punished with imprisonment of either description for a term which may extend to ten years, and shall also be liable to fine.",punishment:"Imprisonment up to ten years, plus fine.",illustrations:[],crossRefs:[147]},{id:151,ipc:124,category:"AA",title:"Assaulting President, Governor, etc., with intent to compel or restrain the exercise of any lawful power",text:"Whoever, with the intention of inducing or compelling the President of India, or Governor of any State, to exercise or refrain from exercising in any manner any of the lawful powers of such President or Governor, assaults or wrongfully restrains, or attempts wrongfully to restrain, or overawes, by means of criminal force or the show of criminal force, or attempts so to overawe, such President or Governor, shall be punished with imprisonment of either description for a term which may extend to seven years, and shall also be liable to fine.",punishment:"Imprisonment up to seven years, plus fine.",illustrations:[],crossRefs:[]},{id:152,ipc:"124A",category:"AA",title:"Acts endangering sovereignty, unity and integrity of India",text:"Whoever, purposely or knowingly, by words, either spoken or written, or by signs, or by visible representation, or by electronic communication or by use of financial means, or otherwise, excites or attempts to excite, secession or armed rebellion or subversive activities, or encourages feelings of separatist activities or endangers sovereignty or unity and integrity of India, or indulges in or commits any such act, shall be punished with imprisonment for life or with imprisonment which may extend to seven years, and shall also be liable to fine.",simpleExplanation:"This is BNS's replacement for the old, highly controversial 'sedition' provision (IPC Section 124A). It's framed differently \u2014 not around criticism of government, but around exciting secession, armed rebellion, or acts endangering India's sovereignty/unity. The Explanation below is the safeguard: honest criticism of government policy through lawful means is expressly carved out and protected.",explanations:["Comments expressing disapproval of the measures, or administrative or other action, of the Government, made with a view to obtaining their alteration by lawful means, without exciting or attempting to excite the activities referred to in this section, do not constitute an offence under this section."],punishment:"Imprisonment for life, or up to seven years, plus fine.",illustrations:[],crossRefs:[]},{id:153,ipc:125,category:"AA",title:"Waging war against the Government of any foreign State at peace with the Government of India",text:"Whoever wages war against the Government of any foreign State at peace with the Government of India, or attempts to wage such war, or abets the waging of such war, shall be punished with imprisonment for life, to which fine may be added, or with imprisonment of either description for a term which may extend to seven years, to which fine may be added, or with fine.",illustrations:[],crossRefs:[]},{id:154,ipc:126,category:"AA",title:"Committing depredation on territories of foreign State at peace with the Government of India",text:"Whoever commits depredation, or makes preparations to commit depredation, on the territories of any foreign State at peace with the Government of India, shall be punished with imprisonment of either description for a term which may extend to seven years, and shall also be liable to fine and to forfeiture of any property used or intended to be used in committing such depredation, or acquired by such depredation.",illustrations:[],crossRefs:[]},{id:155,ipc:127,category:"AA",title:"Receiving property taken by war or depredation mentioned in Sections 153 and 154",text:"Whoever receives any property knowing the same to have been taken in the commission of any of the offences mentioned in sections 153 and 154, shall be punished with imprisonment of either description for a term which may extend to seven years, and shall also be liable to fine and to forfeiture of the property so received.",illustrations:[],crossRefs:[153,154]},{id:156,ipc:128,category:"AA",title:"Public servant voluntarily allowing prisoner of State or war to escape",text:"Whoever, being a public servant and having the custody of any State prisoner or prisoner of war, voluntarily allows such prisoner to escape from any place in which such prisoner is confined, shall be punished with imprisonment for life, or imprisonment of either description for a term which may extend to ten years, and shall also be liable to fine.",illustrations:[],crossRefs:[157]},{id:157,ipc:129,category:"AA",title:"Public servant negligently suffering such prisoner to escape",text:"Whoever, being a public servant and having the custody of any State prisoner or prisoner of war, negligently suffers such prisoner to escape from any place of confinement in which such prisoner is confined, shall be punished with simple imprisonment for a term which may extend to three years, and shall also be liable to fine.",simpleExplanation:"The companion offence to Section 156 \u2014 same custodial failure, but the difference is intent. Voluntarily allowing escape (156) means deliberate or knowing conduct; negligently suffering escape (157) means carelessness, not deliberate action. That's why the punishment gap is so large \u2014 life/ten years versus three years simple imprisonment.",illustrations:[],crossRefs:[156]},{id:158,ipc:130,category:"AA",title:"Aiding escape of, rescuing or harbouring such prisoner",text:"Whoever knowingly aids or assists any State prisoner or prisoner of war in escaping from lawful custody, or rescues or attempts to rescue any such prisoner, or harbours or conceals any such prisoner who has escaped from lawful custody, or offers or attempts to offer any resistance to the recapture of such prisoner, shall be punished with imprisonment for life, or with imprisonment of either description for a term which may extend to ten years, and shall also be liable to fine.",explanations:["A State prisoner or prisoner of war who is permitted to be at large on parole within certain limits in India is said to escape from lawful custody if he goes beyond those limits."],illustrations:[],crossRefs:[156]},{id:189,ipc:141,category:"BB",title:"Unlawful assembly",text:"(1) An assembly of five or more persons is designated an 'unlawful assembly' if the common object of the persons composing it is: (a) to overawe by criminal force the Central or State Government, Parliament, or a State Legislature, or a public servant exercising lawful power; or (b) to resist the execution of any law or legal process; or (c) to commit any mischief, criminal trespass, or other offence; or (d) by criminal force, to take/obtain possession of property, or deprive a person of a right of way or use of water or other incorporeal right, or to enforce a right or supposed right; or (e) by criminal force, to compel a person to do what they are not legally bound to do, or omit what they are legally entitled to do. (2)-(9) Membership of, joining, continuing in, or failing to disperse from such an assembly is separately punishable, on an escalating scale depending on whether the member is armed, knows the assembly was ordered to disperse, or is the one hiring/harbouring participants.",simpleExplanation:"Note that an unlawful assembly is defined entirely by its shared purpose (one of five listed objects), not by anything violent actually happening \u2014 that's what separates it from Rioting (Section 191), which requires force or violence to have actually been used.",explanations:["An assembly that was lawful when it gathered may subsequently become an unlawful assembly if its object changes.","If the assembly is already an unlawful assembly under sub-section (1), an offender under sub-section (5) is punished instead under sub-section (3)."],punishment:"Simple membership: up to 6 months or fine or both. Continuing after order to disperse: up to 2 years or fine or both. Being armed with a deadly weapon as a member: up to 2 years or fine or both. Hiring/harbouring participants: punished as a member for the assembly's own offences.",ingredients:["Five or more persons assembled","A shared common object falling within one of the five listed categories","The person charged knew the facts making the assembly unlawful and intentionally joined or continued in it"],illustrations:[],crossRefs:[190,191]},{id:190,ipc:149,category:"BB",title:"Every member of unlawful assembly guilty of offence committed in prosecution of common object",text:"If an offence is committed by any member of an unlawful assembly in prosecution of the common object of that assembly, or such as the members of that assembly knew to be likely to be committed in prosecution of that object, every person who, at the time of the committing of that offence, is a member of the same assembly, is guilty of that offence.",simpleExplanation:"This is the 'constructive liability' provision \u2014 it makes every member of the mob liable for what any one member does, as long as it was either the shared goal or something the group could reasonably foresee. You don't have to have thrown the stone yourself to be guilty of the offence the stone caused.",punishment:"The same punishment as for the offence actually committed.",illustrations:[],crossRefs:[189]},{id:191,ipc:146,category:"BB",title:"Rioting",text:"(1) Whenever force or violence is used by an unlawful assembly, or by any member of it, in prosecution of the common object of the assembly, every member of the assembly is guilty of the offence of rioting. (2) Rioting is punishable with imprisonment up to two years, or fine, or both. (3) Rioting while armed with a deadly weapon is punishable with imprisonment up to five years, or fine, or both.",ingredients:["An unlawful assembly (Section 189) exists","Force or violence is actually used by the assembly, or any member of it, in prosecution of the common object"],illustrations:[],crossRefs:[189,190]},{id:192,ipc:153,category:"BB",title:"Wantonly giving provocation with intent to cause riot",text:"Whoever malignantly, or wantonly by doing anything illegal, gives provocation to any person, intending or knowing it likely that such provocation will cause the offence of rioting to be committed, shall \u2014 if rioting is committed in consequence \u2014 be punished with imprisonment up to one year, or fine, or both; if rioting is not committed, with imprisonment up to six months, or fine, or both.",illustrations:[],crossRefs:[191]},{id:193,ipc:154,category:"BB",title:"Liability of owner, occupier, etc., of land on which an unlawful assembly or riot takes place",text:"(1) Where an unlawful assembly or riot occurs on land, the owner/occupier (or anyone claiming an interest in it) is punishable with fine up to one thousand rupees if they (or their agent/manager), knowing of it or having reason to believe it was likely, fail to give the earliest possible notice to the nearest police station, fail to use all lawful means to prevent it beforehand, or fail to use all lawful means to disperse or suppress it once it occurs. (2)-(3) Where the riot is committed for the benefit of, or on behalf of, such a person with an interest in the land or the underlying dispute, that person (or their agent/manager) is separately punishable with fine on the same failure-to-prevent basis.",illustrations:[],crossRefs:[189,191]},{id:194,ipc:159,category:"BB",title:"Affray",text:"(1) When two or more persons, by fighting in a public place, disturb the public peace, they are said to commit an affray. (2) Affray is punishable with imprisonment up to one month, or fine up to one thousand rupees, or both.",illustrations:[],crossRefs:[]},{id:195,ipc:152,category:"BB",title:"Assaulting or obstructing public servant when suppressing riot, etc.",text:"(1) Assaulting, obstructing, or using criminal force on a public servant discharging their duty to disperse an unlawful assembly or suppress a riot/affray is punishable with imprisonment up to three years, or fine not less than twenty-five thousand rupees, or both. (2) Threatening or attempting the same is punishable with imprisonment up to one year, or fine, or both.",illustrations:[],crossRefs:[189,191]},{id:196,ipc:"153A",category:"BB",title:"Promoting enmity between different groups on grounds of religion, race, etc., and acts prejudicial to maintenance of harmony",text:"(1) Whoever \u2014 (a) by words, signs, visible representation, or electronic communication, promotes or attempts to promote disharmony or feelings of enmity, hatred, or ill-will between groups on grounds of religion, race, place of birth, residence, language, caste, community, or any other ground; or (b) commits an act prejudicial to the maintenance of harmony between such groups, likely to disturb public tranquillity; or (c) organises, trains for, or participates in any exercise/drill/movement intending or knowing it likely that participants will use or be trained to use criminal force or violence against such a group, causing fear or insecurity among its members \u2014 shall be punished with imprisonment up to three years, or fine, or both. (2) The same offence committed in a place of worship or religious assembly is punishable with imprisonment up to five years, and fine.",illustrations:[],crossRefs:[]},{id:197,ipc:"153B",category:"BB",title:"Imputations, assertions prejudicial to national integration",text:"(1) Whoever, by words, signs, visible representation, or electronic communication \u2014 (a) imputes that any class of persons cannot, by reason of religion/race/language/regional/caste/community membership, bear true faith and allegiance to the Constitution or uphold India's sovereignty and integrity; or (b) asserts that such persons should be denied their rights as citizens; or (c) makes an assertion/appeal about the obligations of such persons that is likely to cause disharmony or enmity; or (d) publishes false or misleading information jeopardising India's sovereignty, unity, integrity, or security \u2014 shall be punished with imprisonment up to three years, or fine, or both. (2) The same offence committed in a place of worship or religious assembly is punishable with imprisonment up to five years, and fine.",illustrations:[],crossRefs:[196]},{id:351,ipc:503,category:"CC",title:"Criminal intimidation",text:"(1) Whoever threatens by any means another with injury to their person, reputation, or property (or to a person in whom that person is interested), intending to cause alarm, or to compel them to do an act they are not legally bound to do, or omit an act they are legally entitled to do \u2014 as the means of avoiding execution of the threat \u2014 commits criminal intimidation. (2) Basic punishment: imprisonment up to two years, or fine, or both. (3) Where the threat is to cause death, grievous hurt, destruction of property by fire, an offence punishable with death/life/up to seven years' imprisonment, or to impute unchastity to a woman: imprisonment up to seven years, or fine, or both. (4) Where committed by anonymous communication, or having concealed the sender's identity: an additional two years' imprisonment on top of the punishment under sub-section (1).",explanations:["A threat to injure the reputation of a deceased person in whom the threatened person is interested falls within this section."],ingredients:["A threat of injury to person, reputation, or property (of the person threatened or someone they care about)","Made with intent to cause alarm, or to compel an act/omission as the means of avoiding the threat"],illustrations:["A, to induce B to desist from prosecuting a civil suit, threatens to burn B's house. A is guilty of criminal intimidation."],crossRefs:[]},{id:352,ipc:504,category:"CC",title:"Intentional insult with intent to provoke breach of peace",text:"Whoever intentionally insults another, thereby giving provocation, intending or knowing it likely that such provocation will cause the person to break the public peace or commit any other offence, shall be punished with imprisonment up to two years, or fine, or both.",illustrations:[],crossRefs:[]},{id:353,ipc:505,category:"CC",title:"Statements conducing to public mischief",text:"(1) Making, publishing, or circulating (including electronically) any statement, false information, rumour, or report \u2014 (a) intending or likely to cause armed-forces personnel to mutiny or disregard duty; or (b) intending or likely to cause fear/alarm to the public leading someone to commit an offence against the State or public tranquillity; or (c) intending or likely to incite one class/community against another \u2014 is punishable with imprisonment up to three years, or fine, or both. (2) The same, aimed at creating enmity between religious/racial/language/regional/caste groups, carries the same punishment. (3) If committed in a place of worship or religious assembly: imprisonment up to five years, and fine.",provisos:["It is not an offence if the person had reasonable grounds to believe the statement was true and made/published/circulated it in good faith, without any of the intents listed above."],illustrations:[],crossRefs:[]},{id:354,ipc:508,category:"CC",title:"Act caused by inducing person to believe that he will be rendered an object of the Divine displeasure",text:"Whoever voluntarily causes or attempts to cause a person to do (or omit) something they are not legally bound to do (or legally entitled to do), by inducing a belief that they or someone they care about will become an object of Divine displeasure otherwise, shall be punished with imprisonment up to one year, or fine, or both.",illustrations:["A sits dharna at Z's door intending to cause it to be believed that, by so sitting, he renders Z an object of Divine displeasure. A has committed the offence.","A threatens Z that, unless Z performs a certain act, A will kill one of his own children, in circumstances where the killing would be believed to render Z an object of Divine displeasure. A has committed the offence."],crossRefs:[]},{id:355,ipc:510,category:"CC",title:"Misconduct in public by a drunken person",text:"Whoever, in a state of intoxication, appears in any public place or a place they are trespassing into, and conducts themselves so as to cause annoyance to any person, shall be punished with simple imprisonment up to twenty-four hours, or fine up to one thousand rupees, or both, or with community service.",illustrations:[],crossRefs:[]},{id:356,ipc:499,category:"DD",title:"Defamation",text:"(1) Whoever, by words (spoken or intended to be read), signs, or visible representations, makes or publishes any imputation concerning a person, intending to harm (or knowing/having reason to believe it will harm) that person's reputation, is said \u2014 except in the cases excepted below \u2014 to defame that person. (2) Defamation is punishable with simple imprisonment up to two years, or fine, or both, or community service. (3) Printing or engraving defamatory matter, knowing it to be such, is punishable with simple imprisonment up to two years, or fine, or both. (4) Selling or offering for sale printed/engraved defamatory matter, knowing it to contain such matter, carries the same punishment as sub-section (3).",simpleExplanation:"Defamation has two layers: the definition (what counts as defaming someone) and ten Exceptions (situations that look like defamation but the law protects anyway \u2014 fair comment on public servants, true statements for the public good, court reporting, good-faith reviews of a book/performance, and so on). Subramanian Swamy is the case to know here: it settled that criminal defamation itself is constitutional, not just civil defamation.",explanations:["Explanation 1: Imputing something to a deceased person can be defamation if it would harm their reputation while living, and is meant to hurt their family's feelings.","Explanation 2: An imputation against a company, association, or collection of persons can amount to defamation.","Explanation 3: An imputation made as an alternative, or expressed ironically, can still amount to defamation.","Explanation 4: No imputation harms reputation unless it lowers the person's moral/intellectual character, their character in respect of caste or calling, their credit, or causes belief that their body is in a loathsome or generally disgraceful state."],provisos:["Exception 1 \u2014 True imputations made for the public good.","Exception 2 \u2014 Good-faith opinion on a public servant's conduct in discharging public functions (and character only as it appears in that conduct).","Exception 3 \u2014 Good-faith opinion on any person's conduct touching a public question (character only as it appears in that conduct).","Exception 4 \u2014 Publishing a substantially true report of Court proceedings.","Exception 5 \u2014 Good-faith opinion on the merits of a case already decided by a Court, or on a party/witness/agent's conduct in it.","Exception 6 \u2014 Good-faith opinion on the merits of a performance its author submitted to public judgment (a book, speech, public performance).","Exception 7 \u2014 Good-faith censure by someone with lawful authority over another (a Judge on a witness, a parent on a child, an employer on an employee), limited to matters within that authority.","Exception 8 \u2014 Good-faith accusation to a person with lawful authority over the person accused.","Exception 9 \u2014 Good-faith imputation made to protect the interests of the speaker, another person, or the public.","Exception 10 \u2014 A good-faith caution given for the benefit of the person warned, someone they care about, or the public."],ingredients:["An imputation concerning a person, made or published by words/signs/visible representation","Made with intent to harm reputation, or knowledge/reason to believe it will","Does not fall within any of the ten Exceptions"],illustrations:["A says 'Z is an honest man; he never stole B's watch,' intending to cause it to be believed that Z did steal B's watch. This is defamation, unless within an Exception.","A draws a picture of Z running away with B's watch, intending it to be believed that Z stole B's watch. This is defamation, unless within an Exception."],crossRefs:[],cases:[{name:"Subramanian Swamy v. Union of India",cite:"(2016) 7 SCC 221",year:2016,ratio:"The Supreme Court upheld the constitutional validity of criminal defamation, holding that the right to reputation under Article 21 justifies criminal defamation as a reasonable restriction on free speech under Article 19(2) \u2014 free speech and the right to reputation must be balanced, not one automatically trumping the other.",url:"https://indiankanoon.org/doc/80997184/"}]},{id:357,ipc:491,category:"DD",title:"Breach of contract to attend on and supply wants of helpless person",text:"Whoever, being bound by a lawful contract to attend on or supply the wants of a person who, by reason of youth, mental illness, disease, or bodily weakness, is helpless or incapable of providing for their own safety or wants, voluntarily omits to do so, shall be punished with imprisonment up to three months, or fine up to five thousand rupees, or both.",illustrations:[],crossRefs:[]},{id:303,ipc:378,category:"EE",title:"Theft",text:"(1) Whoever, intending to take dishonestly any movable property out of the possession of any person without that person's consent, moves that property in order to such taking, is said to commit theft.",simpleExplanation:"Four things must line up: the property must be movable, it must be taken out of someone's possession, without their consent, and \u2014 the part students most often get wrong \u2014 the offence is complete the instant the property is *moved* with dishonest intent, even if the thief is caught a second later and never actually gets away with it. You don't need asportation (successful carrying-away) for theft to be committed, just the dishonest moving.",explanations:["Explanation 1: A thing so long as it is attached to the earth, not being movable property, is not the subject of theft; but it becomes capable of being the subject of theft as soon as it is severed from the earth.","Explanation 2: A moving effected by the same act which effects the severance may be a theft.","Explanation 3: A person is said to cause a thing to move by removing an obstacle which prevented it from moving, or by separating it from any other thing, as well as by actually moving it.","Explanation 4: A person who by any means causes an animal to move is said to move that animal, and to move everything which, in consequence of the motion so caused, is moved by that animal.","Explanation 5: The consent mentioned in this section may be express or implied, and may be given either by the person in possession, or by any person having authority, express or implied, for that purpose."],punishment:"Imprisonment up to three years, or fine, or both. On a second or subsequent conviction: rigorous imprisonment of one to five years, and fine. Where the stolen property is worth less than \u20B95,000 and it's a first conviction, the court may order community service instead, if the value or the property itself is returned.",ingredients:["The property is movable","It was taken out of the possession of another person","It was taken without that person's consent","The taking (moving) was done with dishonest intention"],illustrations:["A cuts down a tree on Z's ground, with the intention of dishonestly taking the tree out of Z's possession without Z's consent. As soon as A has severed the tree in order to such taking, he has committed theft.","A puts a bait for dogs in his pocket, and thus induces Z's dog to follow it. If A's intention is to dishonestly take the dog out of Z's possession without Z's consent, A has committed theft as soon as Z's dog begins to follow A.","A meets a bullock carrying a box of treasure. He drives the bullock in a certain direction to dishonestly take the treasure. As soon as the bullock begins to move, A has committed theft of the treasure.","A, being Z's servant and entrusted with the care of Z's plate, dishonestly runs away with the plate, without Z's consent. A has committed theft.","Z, going on a journey, entrusts his plate to A, a warehouse-keeper, till Z returns. A carries the plate to a goldsmith and sells it. Here the plate was not in Z's possession, so it could not be taken out of Z's possession \u2014 A has not committed theft, though he may have committed criminal breach of trust.","A finds a ring belonging to Z on a table in the house Z occupies. The ring is in Z's possession, and if A dishonestly removes it, A commits theft.","A finds a ring lying on the highroad, not in the possession of any person. A, by taking it, commits no theft, though he may commit criminal misappropriation.","A sees a ring belonging to Z lying on a table in Z's house. Not venturing to misappropriate it immediately for fear of detection, A hides it where it is highly improbable Z will ever find it, intending to retrieve and sell it once the loss is forgotten. A commits theft at the moment he first moves the ring.","A delivers his watch to Z, a jeweller, for repair. A, not owing Z any debt that would let Z lawfully detain the watch, openly enters the shop, takes his watch by force from Z's hand, and carries it away. A may have committed criminal trespass and assault, but not theft, since what he did was not done dishonestly.","If A owes Z money for repairing the watch, and Z lawfully retains it as security, and A takes the watch from Z's possession intending to deprive Z of that security, A commits theft, since he takes it dishonestly.","If A, having pawned his watch to Z, takes it out of Z's possession without Z's consent, without having repaid what he borrowed, he commits theft \u2014 even though the watch is his own property \u2014 because he takes it dishonestly.","A takes an article belonging to Z out of Z's possession without consent, intending to keep it until Z pays a reward for its return. A takes dishonestly and has therefore committed theft.","A, on friendly terms with Z, enters Z's library in Z's absence and takes a book merely to read it, intending to return it. If A believed he had Z's implied consent, A has not committed theft.","A asks charity from Z's wife. She gives A money, food, and clothes she knows belong to Z, her husband. If A reasonably believed she was authorised to give alms, A has not committed theft.","A is the paramour of Z's wife. She gives A valuable property she knows belongs to Z and that she has no authority to give. If A takes it dishonestly, he commits theft.","A, in good faith believing property belonging to Z is actually his own, takes it out of Z's possession. As A does not take dishonestly, he does not commit theft."],crossRefs:[],cases:[{name:"Pyare Lal Bhargava v. State of Rajasthan",cite:"AIR 1963 SC 1094",year:1962,ratio:"The Supreme Court held that theft doesn't require permanent deprivation \u2014 temporarily removing property, even with intent to return it, still amounts to theft if it causes wrongful loss to the possessor in the meantime. A government official who temporarily removed and later returned an office file was still guilty of theft.",url:"https://indiankanoon.org/doc/1689792/"}]},{id:304,ipc:null,category:"EE",title:"Snatching",text:"(1) Theft is 'snatching' if, in order to commit theft, the offender suddenly or quickly or forcibly seizes, secures, grabs, or takes away any movable property from any person or from their possession. (2) Whoever commits snatching shall be punished with imprisonment up to three years, and shall also be liable to fine.",simpleExplanation:"This is a genuinely new offence \u2014 it didn't exist as a separate provision in the IPC, where a snatched phone or chain would just be prosecuted as ordinary theft (or robbery, if force against the person was used). BNS carves 'snatching' out as its own named offence, reflecting how common chain- and phone-snatching had become.",punishment:"Imprisonment up to three years, plus fine.",illustrations:[],crossRefs:[303]},{id:305,ipc:380,category:"EE",title:"Theft in a dwelling house, or means of transportation or place of worship, etc.",text:"Whoever commits theft \u2014 (1) in any building, tent, or vessel used as a human dwelling or for the custody of property; or (2) of any means of transport used to carry goods or passengers; or (3) of any article or goods from such a means of transport; or (4) of an idol or icon in a place of worship; or (5) of any property of the Government or a local authority \u2014 shall be punished with imprisonment up to seven years, and shall also be liable to fine.",punishment:"Imprisonment up to seven years, plus fine. Cognizable, non-bailable, triable by any Magistrate.",illustrations:[],crossRefs:[303]},{id:306,ipc:381,category:"EE",title:"Theft by clerk or servant of property in possession of master",text:"Whoever, being a clerk or servant, or employed as a clerk or servant, commits theft of property in the possession of their master or employer, shall be punished with imprisonment up to seven years, and shall also be liable to fine.",punishment:"Imprisonment up to seven years, plus fine. Cognizable, non-bailable, triable by any Magistrate.",illustrations:[],crossRefs:[303]},{id:307,ipc:382,category:"EE",title:"Theft after preparation made for causing death, hurt or restraint in order to the committing of theft",text:"Whoever commits theft, having made preparation for causing death, hurt, restraint, or fear of death, hurt, or restraint to any person, in order to commit the theft, or to effect their escape after committing it, or to retain the property taken, shall be punished with rigorous imprisonment up to ten years, and shall also be liable to fine.",punishment:"Rigorous imprisonment up to ten years, plus fine.",illustrations:["A commits theft on property in Z's possession, and while committing the theft has a loaded pistol under his garment, having provided it to hurt Z should Z resist. A has committed the offence defined in this section.","A picks Z's pocket, having posted several companions nearby to restrain Z if Z should perceive what is happening and resist or attempt to apprehend A. A has committed the offence defined in this section."],crossRefs:[303]},{id:308,ipc:383,category:"FF",title:"Extortion",text:"(1) Whoever intentionally puts any person in fear of injury to that person or any other, and thereby dishonestly induces the person so put in fear to deliver to any person any property, valuable security, or anything signed or sealed which may be converted into a valuable security, commits 'extortion'.",simpleExplanation:"The core distinction from theft: extortion involves the victim *handing over* the property themselves, induced by fear \u2014 there's a delivery, not a taking. That's also what separates it from robbery: extortion becomes robbery only when the fear is of instant harm and the offender is physically present when it happens (Section 309).",punishment:"Base: imprisonment up to seven years, or fine, or both (sub-section 2). Merely attempting to instil fear in order to extort: up to two years, or fine, or both (sub-section 3). Fear of death/grievous hurt used to extort: up to seven years, plus fine (sub-section 4); if extortion is actually committed this way: up to ten years, plus fine (sub-section 5). Fear of a false accusation carrying death/life/up to ten years' imprisonment, used to attempt extortion: up to ten years, plus fine (sub-section 6); if committed: up to ten years, plus fine (sub-section 7).",illustrations:["A threatens to publish a defamatory libel concerning Z unless Z gives him money. Z gives him money. A has committed extortion.","A threatens Z that he will wrongfully confine Z's child unless Z signs and delivers a promissory note to A. Z does so. A has committed extortion.","A threatens to send men to plough up Z's field unless Z signs and delivers a bond to B. Z does so. A has committed extortion.","A, by putting Z in fear of grievous hurt, dishonestly induces Z to sign a blank paper and deliver it to A, which may be converted into a valuable security. A has committed extortion.","A sends Z an electronic message: 'Your child is in my possession and will be put to death unless you send me one lakh rupees.' Z sends the money. A has committed extortion."],crossRefs:[309]},{id:309,ipc:390,category:"GG",title:"Robbery",text:"(1) In all robbery there is either theft or extortion. (2) Theft is 'robbery' if, in order to commit the theft, or while committing it, or while carrying away or attempting to carry away the stolen property, the offender voluntarily causes or attempts to cause death, hurt, wrongful restraint, or fear of instant death, hurt, or wrongful restraint to any person. (3) Extortion is 'robbery' if the offender, at the time of committing it, is present before the person put in fear, and commits the extortion by putting them in fear of instant death, instant hurt, or instant wrongful restraint, and by that fear induces them to deliver up the thing then and there.",simpleExplanation:"Robbery isn't a separate offence from scratch \u2014 it's aggravated theft or aggravated extortion. The aggravating ingredient is always the same: death, hurt, restraint, or the instant fear of one of these, tied to the taking. That's why Section 309(1) opens by saying 'in all robbery there is either theft or extortion' \u2014 you must first establish one of those two before robbery can exist at all.",explanations:["The offender is said to be 'present' if he is sufficiently near to put the other person in fear of instant death, instant hurt, or instant wrongful restraint."],punishment:"Rigorous imprisonment up to ten years, plus fine (up to fourteen years if committed on the highway between sunset and sunrise). Attempt to commit robbery: rigorous imprisonment up to seven years, plus fine. Voluntarily causing hurt while committing or attempting robbery: imprisonment for life, or rigorous imprisonment up to ten years, plus fine \u2014 for every person jointly concerned.",ingredients:["Either theft or extortion is first established","The taking is accompanied by voluntarily causing (or attempting/threatening) death, hurt, or wrongful restraint","For theft-based robbery: this happens in order to commit the theft, while committing it, or while escaping with the property","For extortion-based robbery: the offender is physically present and the fear is of something instant, not future"],illustrations:["A holds Z down and fraudulently takes Z's money and jewels from his clothes, without consent. A has committed theft, and in order to commit it, has voluntarily caused wrongful restraint to Z \u2014 A has therefore committed robbery.","A meets Z on the highroad, shows a pistol, and demands Z's purse. Z surrenders it. A has extorted the purse by putting Z in fear of instant hurt while present \u2014 A has therefore committed robbery.","A meets Z and Z's child on the highroad. A takes the child and threatens to fling it down a precipice unless Z delivers his purse. Z does so. A has committed robbery on Z, by causing fear of instant hurt to the child present there.","A obtains property from Z by messaging 'Your child is in the hands of my gang and will be put to death unless you send ten thousand rupees.' This is extortion \u2014 but not robbery, unless Z is put in fear of the *instant* death of the child."],crossRefs:[303,308,310]},{id:310,ipc:391,category:"GG",title:"Dacoity",text:"(1) When five or more persons conjointly commit or attempt to commit a robbery \u2014 or where the total number of persons committing/attempting the robbery, together with those present and aiding, amounts to five or more \u2014 every person so committing, attempting, or aiding is said to commit 'dacoity'.",simpleExplanation:"Dacoity is simply group robbery with a numbers threshold \u2014 five or more. The headcount includes not just those who physically rob, but anyone present and aiding, so a four-person robbery with one lookout still counts as dacoity.",punishment:"Imprisonment for life, or rigorous imprisonment up to ten years, plus fine. If murder is committed by any one of five-or-more persons conjointly committing dacoity, every one of them faces death, life imprisonment, or rigorous imprisonment of not less than ten years, plus fine. Mere preparation for dacoity: rigorous imprisonment up to ten years, plus fine. Being one of five-or-more assembled to commit dacoity: rigorous imprisonment up to seven years, plus fine. Belonging to a gang habitually committing dacoity: imprisonment for life, or rigorous imprisonment up to ten years, plus fine.",ingredients:["Five or more persons (including those present and aiding)","Conjointly committing or attempting a robbery"],illustrations:[],crossRefs:[309]},{id:311,ipc:397,category:"GG",title:"Robbery, or dacoity, with attempt to cause death or grievous hurt",text:"If, at the time of committing robbery or dacoity, the offender uses any deadly weapon, causes grievous hurt to any person, or attempts to cause death or grievous hurt to any person, the term of imprisonment shall not be less than seven years.",punishment:"Imprisonment of not less than seven years, plus fine. Cognizable, non-bailable, triable by Court of Session.",illustrations:[],crossRefs:[309,310]},{id:312,ipc:398,category:"GG",title:"Attempt to commit robbery or dacoity when armed with deadly weapon",text:"If, at the time of attempting to commit robbery or dacoity, the offender is armed with any deadly weapon, the term of imprisonment shall not be less than seven years.",punishment:"Imprisonment of not less than seven years. Cognizable, non-bailable, triable by Court of Session.",illustrations:[],crossRefs:[309,310]},{id:313,ipc:401,category:"GG",title:"Punishment for belonging to gang of robbers, etc.",text:"Whoever belongs to any gang of persons associated for habitually committing theft or robbery, not being a gang of dacoits, shall be punished with rigorous imprisonment up to seven years, and shall also be liable to fine.",punishment:"Rigorous imprisonment up to seven years, plus fine. Cognizable, non-bailable, triable by Magistrate of the first class.",illustrations:[],crossRefs:[303,309]},{id:314,ipc:403,category:"HH",title:"Dishonest misappropriation of property",text:"Whoever dishonestly misappropriates or converts to their own use any movable property shall be punished with imprisonment of six months to two years, and fine.",simpleExplanation:"The key difference from theft: here, the accused's original possession of the property was innocent \u2014 they found it, or it came to them lawfully \u2014 and the offence lies purely in the dishonest decision to keep or use it afterward, not in how it was obtained.",explanations:["Explanation 1: A dishonest misappropriation for a time only is still a misappropriation within the meaning of this section.","Explanation 2: A person who finds property not in anyone's possession, and takes it to protect or restore it to the owner, does not dishonestly misappropriate it, and commits no offence. But they become guilty if they appropriate it once they know (or could discover) the owner, or before using reasonable means and reasonable time to find and notify the owner. What counts as reasonable means or reasonable time is a question of fact \u2014 it's enough that at the time of appropriating, the finder does not believe it is their own, or does not, in good faith, believe the real owner cannot be found."],punishment:"Imprisonment of six months to two years, and fine. Non-cognizable, bailable, triable by any Magistrate.",illustrations:["A takes property belonging to Z out of Z's possession, in good faith believing it to be his own. A is not guilty of theft \u2014 but if A, after discovering the mistake, dishonestly appropriates the property, he is guilty under this section.","A, on friendly terms with Z, takes a book from Z's library without express consent, believing he has implied consent to read it \u2014 no theft. But if A later sells the book for his own benefit, he is guilty under this section.","A and B jointly own a horse. A takes it out of B's possession intending to use it \u2014 no dishonest misappropriation, since A has a right to use it. But if A sells the horse and keeps the proceeds, he is guilty under this section.","A finds a Government promissory note belonging to Z, bearing a blank endorsement. Knowing it belongs to Z, A pledges it with a banker as security for a loan, intending to restore it later. A has committed the offence under this section.","A finds a rupee on the highroad, not knowing to whom it belongs, and picks it up. A has not committed the offence under this section.","A finds a letter on the road containing a bank note, and learns from its contents whom it belongs to. He appropriates the note. He is guilty under this section.","A finds a bearer cheque and cannot identify who lost it, but the drawer's name appears, and A knows the drawer could direct him to the payee. A appropriates the cheque without attempting to find the owner. He is guilty under this section.","A sees Z drop his purse with money in it. A picks it up meaning to restore it to Z, but afterwards appropriates it. A has committed the offence under this section.","A finds a purse with money not knowing whose it is; he later discovers it is Z's and appropriates it. A is guilty under this section.","A finds a valuable ring, not knowing to whom it belongs, and sells it immediately without attempting to discover the owner. A is guilty under this section."],crossRefs:[303,316]},{id:315,ipc:404,category:"HH",title:"Dishonest misappropriation of property possessed by deceased person at the time of his death",text:"Whoever dishonestly misappropriates or converts to their own use any property, knowing it was in the possession of a deceased person at the time of death, and has not since been
